  function showVictoryModal(game, winTeam, upgradeLevels) {
    const winTeamLabel = winTeam === "A" ? t("A组") : t("B组");

    // 标题：有真人对局时以「你」的视角祝贺/安慰
    const humanOnWinTeam = game.players[0] && game.players[0].isHuman && winTeam === "A";
    const hasHuman = game.players.some(p => p.isHuman);
    $("#victoryTitle").text(
      !hasHuman ? t("本局结束")
        : humanOnWinTeam ? t("🎉 恭喜你获胜！")
        : t("本局结束，对手获胜")
    );

    $("#victoryTeamBadge")
      .text(winTeamLabel)
      .attr("class", "victory-team-badge " + (winTeam === "A" ? "team-a" : "team-b"));

    const winNames = [0, 1, 2, 3]
      .filter(i => game.players[i].team === winTeam)
      .map(i => game.players[i].name);
    const headPlayer = game.players[game.finishedOrder[0]];
    $("#victoryHeadline").text(t("{names} 联手拿下本局，{head} 率先出完牌", { names: winNames.join(" · "), head: headPlayer.name }));

    $("#victoryLevel").text(t("连升 {n} 级 → 下一局打 {rank}", { n: upgradeLevels, rank: game.levelRank }));

    const placeNames = [t("头游"), t("二游"), t("三游"), t("末游")];
    $("#victoryOrder").html(game.finishedOrder.map((pIdx, i) =>
      '<div><span class="place">' + placeNames[i] + '</span>' + game.players[pIdx].name + '</div>'
    ).join(""));

    const stats = lsGetJSON("guandan_challenge_stats", { games: 0, teamA: 0, teamB: 0 });
    $("#victoryRecord").text(t("本机战绩：A组 {a} 胜 · B组 {b} 胜 · 共 {n} 局", { a: stats.teamA || 0, b: stats.teamB || 0, n: stats.games || 0 }));

    $("#victoryOverlay").addClass("show");
    spawnConfetti();
  }

  function hideVictoryModal() {
    $("#victoryOverlay").removeClass("show").find(".confetti-piece").remove();
  }

  // ==================== 座位配置 ====================
  // seatConfig[i] = { type: "human"|"ai", providerId, modelName }  for i=0(南),1(东),2(北),3(西)
  // 每个 AI 座位可独立选择不同服务商/模型（本项目的核心亮点），配置存入 localStorage
  const SEAT_CONFIG_KEY = "guandan_seat_config";
  const SEAT_NAMES = [t("南"), t("东"), t("北"), t("西")];

  function defaultSeatConfig() {
    return {
      0: { type: "human", providerId: "", modelName: "" },
      1: { type: "ai", providerId: "", modelName: "" },
      2: { type: "ai", providerId: "", modelName: "" },
      3: { type: "ai", providerId: "", modelName: "" }
    };
  }

  function loadSeatConfig() {
    const saved = lsGetJSON(SEAT_CONFIG_KEY, null);
    if (!saved) return defaultSeatConfig();
    const cfg = defaultSeatConfig();
    for (let i = 0; i < 4; i++) {
      if (saved[i] && (saved[i].type === "human" || saved[i].type === "ai")) {
        cfg[i] = {
          // 只有南座（0）可以选「人」，东/北/西强制 AI（真人无法操作）
          type: i === 0 ? saved[i].type : "ai",
          providerId: saved[i].providerId || "",
          modelName: saved[i].modelName || ""
        };
      }
    }
    return cfg;
  }

  let seatConfig = loadSeatConfig();

  function saveSeatConfig() {
    lsSetJSON(SEAT_CONFIG_KEY, seatConfig);
  }

  function readSeatConfig() {
    for (let i = 0; i < 4; i++) {
      // 只有南座（0）可选「人」，东/北/西强制 AI（真人无法操作）
      const type = i === 0 ? ($("#cfgSeat" + i).val() === "ai" ? "ai" : "human") : "ai";
      seatConfig[i].type = type;
      if (type === "ai") {
        seatConfig[i].providerId = $("#cfgSeat" + i + "Provider").val() || "";
        seatConfig[i].modelName = $("#cfgSeat" + i + "Model").val() || "";
      }
    }
    saveSeatConfig();
  }

  // 解析某个 AI 座位的实际模型配置；
  // 服务商未选或 Key 缺失时自动落到第一个已配置 Key 的服务商；模型缺省用该服务商默认模型
  function getSeatAiConfig(i) {
    const cfg = seatConfig[i];
    if (!cfg || cfg.type !== "ai") return null;
    const available = getAvailableProviders();
    if (!available.length) return null;
    const providerId = cfg.providerId && getProviderApiKey(cfg.providerId) ? cfg.providerId : available[0];
    const pcfg = getProviderConfig(providerId);
    if (!pcfg) return null;
    let modelName = cfg.modelName;
    if (!modelName || !pcfg.modelOptions.some(m => m.value === modelName)) {
      modelName = pcfg.defaultModel;
    }
    return { providerId, modelName };
  }

  function updateSeatInfo() {
    const seatNames = [t("南"), t("东"), t("北"), t("西")];
    const nameIds = ["#nameBottom", "#nameRight", "#nameTop", "#nameLeft"];
    const teamBadges = [
      '<span class="team-badge team-a">' + t("A组") + '</span>',
      '<span class="team-badge team-b">' + t("B组") + '</span>',
      '<span class="team-badge team-a">' + t("A组") + '</span>',
      '<span class="team-badge team-b">' + t("B组") + '</span>'
    ];
    for (let i = 0; i < 4; i++) {
      const isHuman = seatConfig[i] && seatConfig[i].type === "human";
      const name = seatNames[i] + (isHuman ? t("（你）") : "");
      const aiBadge = (!isHuman && getSeatAiConfig(i))
        ? ' <span class="ai-badge" data-position="' + i + '" title="' + t("查看 AI 对话过程") + '">AI</span>'
        : '';
      const player = game.players[i];
      let countStr = "";
      if (player && game.started) {
        countStr = " " + t("{n} 张", { n: player.cards.length });
        if (player instanceof LLMAIPlayer && player.preparing) {
          countStr += " · " + t("组牌中…");
        } else if (player instanceof LLMAIPlayer && player.thinking) {
          countStr += " · " + t("思考中…");
        } else if (player instanceof LLMAIPlayer && player.chatting) {
          countStr += " · " + t("讨论中…");
        }
      } else {
        countStr = " " + t("27 张");
      }
      // Order: 组名 座位名 AI 张数 状态
      $(nameIds[i]).html(teamBadges[i] + " " + name + aiBadge + countStr);
    }
  }

  // ==================== 全局实例 ====================
  let game = new GuandanGame("2");

  // ---------- LLM Provider 配置见 js/common.js（4 家服务商） ----------
  // 每个 AI 座位在 startNewGame 时按各自配置创建 LLMAIPlayerFactory
  let aiPanelPlayerIdx = -1;
  let aiPanelMsgCount = 0;
  let aiStreamingMsgEl = null;
  let chatQueue = []; // { playerIdx, text } — 用户提问队列，等 agent 空闲后发送
  let chatProcessing = false;
  let chatStreamingMsgEl = null; // 聊天流式输出元素
  // 聊天时只允许查看和理牌，不允许出牌/过牌
  const CHAT_TOOLS = GUANDAN_TOOLS.filter(t => t.function.name !== "play_cards" && t.function.name !== "pass_turn" && t.function.name !== "record_experience");

  // 尝试处理聊天队列（agent 空闲时调用）
  function tryProcessChatQueue() {
    if (chatProcessing || chatQueue.length === 0) return;
    const item = chatQueue[0];
    const player = game.players[item.playerIdx];
    if (!player || !(player instanceof LLMAIPlayer)) {
      chatQueue.shift();
      tryProcessChatQueue();
      return;
    }
    if (player.preparing || player.thinking) return; // agent 还在忙
    // 立刻上锁，防止 decidePlay/prepareHand 在 processChatItem 设置锁之前趁虚而入
    player._chatPromise = new Promise(resolve => { player._chatResolve = resolve; });
    player.chatting = true;
    chatProcessing = true;
    chatQueue.shift();
    updateSeatInfo();
    processChatItem(item.playerIdx, item.text);
  }

  async function processChatItem(playerIdx, text) {
    const player = game.players[playerIdx];
    if (!player || !(player instanceof LLMAIPlayer)) {
      // 解锁（锁在 tryProcessChatQueue 中设置）
      if (player && player._chatResolve) { player._chatResolve(); player._chatResolve = null; player._chatPromise = null; }
      chatProcessing = false;
      tryProcessChatQueue();
      return;
    }
    // 聊天锁已在 tryProcessChatQueue 中设置
    try {
      // 移除排队中的 DOM 元素（第一张卡片即为本次提问）
      $("#aiPanelBody").find(".ai-msg-pending").first().remove();

      // 将用户提问加入 messages（用 [Chat] 前缀与 Game State 区分）
      player.messages.push({
        role: "user",
        content: "[Chat] " + text + "\n\n" + t("（提示：用户说话时提到的数字或字母（如「2」「9」「A」「K」）指的是牌面点数，不是 view_hand 里的牌摞编号/索引。需要精确定位手牌时，请先调用 view_hand 查看牌面与对应索引。）")
      });
      if (aiPanelPlayerIdx === playerIdx) {
        renderAIPanel();
        const $body = $("#aiPanelBody");
        $body.scrollTop($body[0].scrollHeight);
      }

      // 创建流式输出元素
      if (aiPanelPlayerIdx === playerIdx) {
        chatStreamingMsgEl = document.createElement("div");
        chatStreamingMsgEl.className = "ai-msg ai-msg-assistant ai-msg-streaming";
        chatStreamingMsgEl.innerHTML = '<div class="role-label">AI <span class="ai-cursor"></span></div><div class="streaming-content"></div><div class="streaming-tools"></div>';
        $("#aiPanelBody").append(chatStreamingMsgEl);
        const $body = $("#aiPanelBody");
        $body.scrollTop($body[0].scrollHeight);
      }

      // 流式回调
      const chatOnChunk = (chunk) => {
        if (!chatStreamingMsgEl) return;
        const content = chunk.content || "";
        const toolCalls = chunk.tool_calls;
        if (content) {
          chatStreamingMsgEl.querySelector(".streaming-content").innerHTML = renderContentWithThink(content);
        }
        if (toolCalls && toolCalls.length > 0) {
          const tcHtml = toolCalls.map(tc => {
            let argsPreview = "";
            try { argsPreview = JSON.stringify(JSON.parse(tc.function.arguments || "{}")); } catch (e) { argsPreview = tc.function.arguments || ""; }
            return '<div style="margin-top:2px"><span class="tool-call-name">' + t("工具：") + escapeHtml(tc.function.name) + '</span>(' + escapeHtml(argsPreview) + ')</div>';
          }).join("");
          chatStreamingMsgEl.querySelector(".streaming-tools").innerHTML = tcHtml;
        }
        const $body = $("#aiPanelBody");
        const el = $body[0];
        if (el.scrollHeight - el.scrollTop - el.clientHeight < 40) {
          $body.scrollTop(el.scrollHeight);
        }
      };

      // 调用 LLM（流式）
      const result = await callLLMWithMessages(player._buildAPIMessages(game), CHAT_TOOLS, player.providerId, player.modelName, chatOnChunk);
      let msg = result.message;
      player.messages.push(msg);

      // 处理工具调用（最多 5 轮）
      let safety = 0;
      let chatPreparing = false;
      while (msg.tool_calls && msg.tool_calls.length > 0 && safety < 5) {
        // 移除流式元素：工具调用触发后，流式展示已完成使命，
        // 后续由 renderAIPanel 从 player.messages 正式渲染，避免 DOM 残留重复
        if (chatStreamingMsgEl) {
          chatStreamingMsgEl.remove();
          chatStreamingMsgEl = null;
        }
        const hasPileOps = msg.tool_calls.some(tc => tc.function.name === "pile_cards" || tc.function.name === "unpile_cards");
        if (hasPileOps && !chatPreparing) {
          chatPreparing = true;
          player.preparing = true;
          player._prepPromise = new Promise(resolve => { player._prepResolve = resolve; });
          updateSeatInfo();
        }
        for (const tc of msg.tool_calls) {
          const fnName = tc.function.name;
          let args = {};
          try { args = JSON.parse(tc.function.arguments || "{}"); } catch (e) {}
          let toolResult;
          try { toolResult = await player._dispatchTool(fnName, args, game); } catch (e) { toolResult = { error: t("工具异常：{e}", { e: e.message }) }; }
          player.messages.push({ role: "tool", tool_call_id: tc.id, content: JSON.stringify(toolResult) });
        }
        // 立即渲染工具结果，让用户实时看到 pile_cards 等操作的反馈
        if (aiPanelPlayerIdx === playerIdx) {
          renderAIPanel();
        }
        // 为后续轮次创建新的流式元素
        if (aiPanelPlayerIdx === playerIdx) {
          chatStreamingMsgEl = document.createElement("div");
          chatStreamingMsgEl.className = "ai-msg ai-msg-assistant ai-msg-streaming";
          chatStreamingMsgEl.innerHTML = '<div class="role-label">AI <span class="ai-cursor"></span></div><div class="streaming-content"></div><div class="streaming-tools"></div>';
          $("#aiPanelBody").append(chatStreamingMsgEl);
        }
        const nextResult = await callLLMWithMessages(player._buildAPIMessages(game), CHAT_TOOLS, player.providerId, player.modelName, chatOnChunk);
        msg = nextResult.message;
        player.messages.push(msg);
        safety++;
      }

      // 移除最后的流式元素（由 renderAIPanel 正式渲染）
      if (chatStreamingMsgEl) {
        chatStreamingMsgEl.remove();
        chatStreamingMsgEl = null;
      }
      if (chatPreparing) {
        player.preparing = false;
        if (player._prepResolve) { player._prepResolve(); player._prepResolve = null; }
        player._prepPromise = null;
        updateSeatInfo();
        renderPlayerCards(playerIdx);
      }

      if (aiPanelPlayerIdx === playerIdx) {
        renderAIPanel();
        const $body = $("#aiPanelBody");
        $body.scrollTop($body[0].scrollHeight);
      }
    } catch (e) {
      // 如果异常退出，确保清理组牌状态和 UI
      if (chatStreamingMsgEl) {
        chatStreamingMsgEl.remove();
        chatStreamingMsgEl = null;
      }
      // Tool call ID 相关错误：自修复上下文
      let fixed = false;
      if (player._isToolIdError && player._isToolIdError(e.message)) {
        const removed = player._fixupToolCalls();
        if (removed > 0) {
          addLog(t("[Chat] {name} 检测到 tool call ID 不匹配，已清理 {n} 条孤立的 tool 消息", { name: player.name, n: removed }));
          player.messages.push({
            role: "user",
            content: t("[Chat] 检测到上下文 tool call 不匹配，已自动清理 {n} 条孤立的 tool 消息。如果你刚才的提问还没被完全回答，请重新提问。", { n: removed })
          });
          fixed = true;
        }
      }
      if (player.preparing && !player.thinking) {
        player.preparing = false;
        if (player._prepResolve) { player._prepResolve(); player._prepResolve = null; }
        player._prepPromise = null;
        updateSeatInfo();
      }
      // 把已收集的结果渲染出来，并在面板中显示错误
      if (aiPanelPlayerIdx === playerIdx) {
        renderAIPanel();
        const $err = $('<div class="ai-msg ai-msg-tool"><div class="role-label">Error</div>' + escapeHtml(e.message) + (fixed ? " " + t("(已自动修复上下文)") : '') + '</div>');
        $("#aiPanelBody").append($err);
        const $body = $("#aiPanelBody");
        $body.scrollTop($body[0].scrollHeight);
      }
      addLog(t("[Chat] {name} 提问处理失败：{e}", { name: player.name, e: e.message }) + (fixed ? " " + t("(已自动修复上下文)") : ""));
    }
    // 解锁聊天，允许 decidePlay/prepareHand 继续
    player.chatting = false;
    if (player._chatResolve) { player._chatResolve(); player._chatResolve = null; player._chatPromise = null; }
    chatProcessing = false;
    updateSeatInfo();
    tryProcessChatQueue(); // 继续处理队列中下一条
  }

  // 发送聊天消息（用户点击发送）
  function sendChatMessage() {
    if (aiPanelPlayerIdx < 0) return;
    const player = game.players[aiPanelPlayerIdx];
    if (!player || !(player instanceof LLMAIPlayer)) return;
    const $input = $("#aiPanelChatInput");
    const text = $input.val().trim();
    if (!text) return;
    $input.val("");

    const isBusy = player.preparing || player.thinking || player.chatting || chatProcessing;

    // 先显示在面板中（排队中或立即发送），后续由 processChatItem 清理并正式渲染
    const $msg = $('<div class="ai-msg ai-msg-user-chat ai-msg-pending">'
      + '<div class="role-label">' + t("你") + (isBusy ? ' <span class="pending-badge">' + t("排队中") + '</span>' : '') + '</div>'
      + escapeHtml(text) + '</div>');
    $("#aiPanelBody").append($msg);
    const $body = $("#aiPanelBody");
    $body.scrollTop($body[0].scrollHeight);

    // 加入队列
    chatQueue.push({ playerIdx: aiPanelPlayerIdx, text });
    tryProcessChatQueue();
  }

  // ---------- AI 对话浮层 ----------
  function showAIPanel(playerIdx) {
    aiPanelPlayerIdx = playerIdx;
    aiPanelMsgCount = 0;
    aiStreamingMsgEl = null;
    const player = game.players[playerIdx];
    if (!player || !(player instanceof LLMAIPlayer)) return;
    // 重置压缩分隔线状态（全量重新渲染）
    if (player._lastCompression) player._lastCompression._shown = false;
    $("#aiPanelTitle").text(t("{name} 决策过程", { name: player.name }));
    $("#aiPanel").css("display", "flex");
    $("#aiPanelBody").empty();
    renderAIPanel();
  }

  function hideAIPanel() {
    aiPanelPlayerIdx = -1;
    aiPanelMsgCount = 0;
    aiStreamingMsgEl = null;
    chatQueue = [];
    chatProcessing = false;
    $("#aiPanel").hide();
  }

  function aiPanelAtBottom($body) {
    const el = $body[0];
    return el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  }

  // Called by streaming LLM response for real-time display
  function renderStreamingChunk(chunk) {
    if (aiPanelPlayerIdx < 0) return;
    const $body = $("#aiPanelBody");
    const atBottom = aiPanelAtBottom($body);

    if (!aiStreamingMsgEl) {
      aiStreamingMsgEl = document.createElement("div");
      aiStreamingMsgEl.className = "ai-msg ai-msg-assistant ai-msg-streaming";
      aiStreamingMsgEl.innerHTML = '<div class="role-label">AI <span class="ai-cursor"></span></div><div class="streaming-content"></div><div class="streaming-tools"></div>';
      $body.append(aiStreamingMsgEl);
      if (atBottom) $body.scrollTop($body[0].scrollHeight);
    }

    const content = chunk.content || "";
    const toolCalls = chunk.tool_calls;

    if (content) {
      const contentHtml = renderContentWithThink(content);
      aiStreamingMsgEl.querySelector(".streaming-content").innerHTML = contentHtml;
    }

    if (toolCalls && toolCalls.length > 0) {
      const tcHtml = toolCalls.map(tc => {
        let argsPreview = "";
        try { argsPreview = JSON.stringify(JSON.parse(tc.function.arguments || "{}")); } catch (e) { argsPreview = tc.function.arguments || ""; }
        return '<div style="margin-top:2px"><span class="tool-call-name">' + t("工具：") + escapeHtml(tc.function.name) + '</span>(' + escapeHtml(argsPreview) + ')</div>';
      }).join("");
      aiStreamingMsgEl.querySelector(".streaming-tools").innerHTML = tcHtml;
    }

    if (atBottom) $body.scrollTop($body[0].scrollHeight);
  }

  // Called by LLMAIPlayer when new messages are added
  function notifyAIPanel(playerIdx) {
    if (aiPanelPlayerIdx === playerIdx && $("#aiPanel").is(":visible")) {
      renderAIPanel();
    }
  }

  function renderAIPanel() {
    if (aiPanelPlayerIdx < 0) return;
    const player = game.players[aiPanelPlayerIdx];
    if (!player || !(player instanceof LLMAIPlayer)) return;

    // Remove streaming element when finalized messages come in
    if (aiStreamingMsgEl) {
      aiStreamingMsgEl.remove();
      aiStreamingMsgEl = null;
    }

    const msgs = player.messages;
    if (msgs.length === 0) {
      if (aiPanelMsgCount === 0) {
        $("#aiPanelBody").html('<div class="ai-panel-empty">' + t("等待 AI 开始思考…") + '</div>');
      }
      return;
    }
    // Only render messages that haven't been shown yet
    let html = "";
    for (let i = aiPanelMsgCount; i < msgs.length; i++) {
      // 上下文压缩分隔线
      if (player._lastCompression && !player._lastCompression._shown && i === player._lastCompression.keptFrom) {
        html += '<div class="ai-msg ai-msg-compress">' + t("━━━ 上下文压缩：此前 {n} 条消息已省略 ━━━", { n: player._lastCompression.removed }) + '</div>';
        player._lastCompression._shown = true;
      }
      const msg = msgs[i];
      const role = msg.role;
      let content = msg.content || "";
      if (Array.isArray(content)) {
        content = content.map(p => typeof p === "string" ? p : (p.text || "")).join("");
      }
      if (role === "system") {
        html += '<div class="ai-msg ai-msg-system"><div class="role-label">System</div>' + t("系统提示词已加载（游戏规则 + 策略指导）") + '</div>';
      } else if (role === "user") {
        if (content.startsWith("[Chat] ")) {
          html += '<div class="ai-msg ai-msg-user-chat"><div class="role-label">' + t("你") + '</div>' + escapeHtml(content.slice(7)) + '</div>';
        } else {
          html += '<div class="ai-msg ai-msg-user"><div class="role-label">Game State</div>' + escapeHtml(content) + '</div>';
        }
      } else if (role === "assistant") {
        let tcHtml = "";
        if (msg.tool_calls && msg.tool_calls.length > 0) {
          tcHtml = msg.tool_calls.map(tc => {
            let argsPreview = "";
            try { argsPreview = JSON.stringify(JSON.parse(tc.function.arguments || "{}")); } catch (e) { argsPreview = tc.function.arguments || ""; }
            return '<div style="margin-top:2px"><span class="tool-call-name">' + t("工具：") + tc.function.name + '</span>(' + escapeHtml(argsPreview) + ')</div>';
          }).join("");
        }
        const textContent = content ? renderContentWithThink(String(content)) : '';
        html += '<div class="ai-msg ai-msg-assistant"><div class="role-label">AI</div>' + textContent + tcHtml + '</div>';
      } else if (role === "tool") {
        let toolContent = content;
        try {
          const parsed = JSON.parse(content);
          if (parsed.error && parsed.overlap) {
            toolContent = t("✗ 索引重叠：") + parsed.error;
          } else if (parsed.error && parsed.invalidIndex) {
            toolContent = t("✗ 索引越界：") + parsed.error;
          } else if (parsed.error) {
            toolContent = t("✗ ") + parsed.error;
          } else if (parsed.success !== undefined) {
            const icon = parsed.success ? "✓" : "✗";
            // groups mode: show summary + details
            if (parsed.details && Array.isArray(parsed.details)) {
              const lines = parsed.details.map(d => {
                const dIcon = d.success ? "✓" : "✗";
                return dIcon + " " + (d.message || d.error || "");
              });
              toolContent = icon + " " + (parsed.summary || "") + "\n" + lines.join("\n");
            } else {
              toolContent = icon + " " + (parsed.summary || parsed.message || parsed.error || "");
            }
          } else if (parsed.hand) {
            toolContent = t("手牌共 {n} 张\n{info}\n牌摞: {piles}", { n: parsed.hand_size, info: parsed.info, piles: parsed.piles });
          } else if (parsed.content !== undefined && parsed.summary) {
            // read_experience result
            if (!parsed.content) {
              toolContent = parsed.summary;
            } else {
              toolContent = parsed.summary + "\n\n" + parsed.content;
            }
          } else if (parsed.rounds) {
            // view_history result
            const header = t("共 {n} 轮 · {m} 次出牌\n", { n: parsed.total_rounds, m: parsed.total_plays });
            const body = parsed.rounds.map(r => {
              return t("第{n}轮\n", { n: r.round }) + r.plays.map(p => "  " + p).join("\n");
            }).join("\n\n");
            const footer = parsed._reminder ? "\n\n" + parsed._reminder : "";
            toolContent = header + "\n" + body + footer;
          }
        } catch (e) {}
        html += '<div class="ai-msg ai-msg-tool"><div class="role-label">Tool Result</div>' + escapeHtml(String(toolContent)) + '</div>';
      }
    }
    if (html) {
      $("#aiPanelBody").append(html);
      aiPanelMsgCount = msgs.length;
    }
    // 把排队中的聊天消息移到底部，防止被新追加的 AI 消息顶到中间
    const $pending = $("#aiPanelBody").find(".ai-msg-pending");
    if ($pending.length > 0) {
      $pending.detach().appendTo("#aiPanelBody");
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // Simple markdown to HTML renderer for LLM output
  function renderMarkdown(text) {
    if (!text) return "";
    // 1. Protect code blocks
    const blocks = [];
    let html = String(text).replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
      blocks.push('<pre><code>' + escapeHtml(code.trim()) + '</code></pre>');
      return '\x00CODE' + (blocks.length - 1) + '\x00';
    });
    // 2. Protect inline code
    html = html.replace(/`([^`]+)`/g, (_, code) => {
      blocks.push('<code>' + escapeHtml(code) + '</code>');
      return '\x00CODE' + (blocks.length - 1) + '\x00';
    });
    // 3. Escape HTML in remaining text
    html = escapeHtml(html);
    // 4. Bold and italic
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // 5. Headers
    html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
    html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
    // 6. List items
    html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
    html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
    // Wrap consecutive <li> in <ul>, remove internal \n so they don't become <br>
    html = html.replace(/(?:<li>.*?<\/li>\n?)+/g, function(match) {
      return '<ul>' + match.replace(/\n/g, '') + '</ul>';
    });
    // 7. Paragraphs: blank-line separated blocks
    html = html.replace(/\n\n+/g, '</p><p>');
    html = html.replace(/\n/g, '<br>');
    // 8. Restore code blocks
    html = html.replace(/\x00CODE(\d+)\x00/g, (_, i) => blocks[parseInt(i)]);
    // 9. Wrap top-level
    if (html.indexOf('<p>') !== 0) html = '<p>' + html + '</p>';
    // 10. Clean empty <p></p>
    html = html.replace(/<p><\/p>/g, '');
    return html;
  }

  // Parse <think>...</think> blocks into collapsible "思考" sections
  function renderContentWithThink(rawContent) {
    let html = "";
    let remaining = String(rawContent);
    while (remaining.length > 0) {
      const thinkStart = remaining.indexOf("<think>");
      if (thinkStart === -1) {
        if (remaining.trim()) {
          html += '<div>' + renderMarkdown(remaining) + '</div>';
        }
        break;
      }
      if (thinkStart > 0) {
        html += '<div>' + renderMarkdown(remaining.substring(0, thinkStart)) + '</div>';
      }
      const thinkEnd = remaining.indexOf("</think>", thinkStart + 7);
      if (thinkEnd === -1) {
        // Streaming: closing tag not yet received
        const partialThink = remaining.substring(thinkStart + 7).trim();
        html += '<div class="ai-think-block streaming">';
        html += '<div class="ai-think-label">' + t("思考中…") + '</div>';
        html += '<div class="ai-think-content">' + (partialThink ? renderMarkdown(partialThink) : '') + '</div>';
        html += '</div>';
        break;
      }
      const thinkContent = remaining.substring(thinkStart + 7, thinkEnd).trim();
      html += '<div class="ai-think-block">';
      html += '<div class="ai-think-label">' + t("思考") + '</div>';
      html += '<div class="ai-think-content">' + renderMarkdown(thinkContent) + '</div>';
      html += '</div>';
      remaining = remaining.substring(thinkEnd + 8);
    }
    return html;
  }
  // ---------- API helpers ----------
  // Cookie / localStorage / Provider 工具统一来自 js/common.js

  function extractContentText(rawContent) {
    if (typeof rawContent === "string") return rawContent;
    if (Array.isArray(rawContent)) {
      return rawContent.map(part => {
        if (typeof part === "string") return part;
        return part && (part.text || part.content) ? (part.text || part.content) : "";
      }).join("");
    }
    return rawContent ? String(rawContent) : "";
  }

  function parseModelJson(text) {
    const raw = String(text || "")
      .replace(/<think>[\s\S]*?<\/think>/gi, "")
      .replace(/```(?:json)?/gi, "")
      .replace(/```/g, "")
      .trim();
    if (!raw) throw new Error(t("模型返回为空"));
    try { return JSON.parse(raw); } catch (e) {
      const start = raw.indexOf("{");
      const end = raw.lastIndexOf("}");
      if (start < 0 || end <= start) throw new Error(t("模型返回不是 JSON"));
      return JSON.parse(raw.slice(start, end + 1));
    }
  }

  // Parse task status from LLM response
  // Looks for {"task":"prep|play","complete":true|false} on the last line
  function parseTaskStatus(content) {
    const text = String(content || "");
    const match = text.match(/\{\s*"task"\s*:\s*"(prep|play)"\s*,\s*"complete"\s*:\s*(true|false)\s*\}/);
    if (!match) return null;
    return { task: match[1], complete: match[2] === "true" };
  }

  async function callLLMWithMessages(messages, tools, providerId, modelName, onChunk) {
    const providerKey = getProviderApiKey(providerId);
    if (!providerKey) throw new Error(t("API Key 缺失"));

    const config = getProviderConfig(providerId);
    if (!config) throw new Error(t("未知 Provider: {name}", { name: providerId }));

    // 始终流式请求；是否实时显示由 onChunk 决定（面板未打开时丢弃块，
    // 中途打开面板也能从下一块接上完整内容，因为每块都带累计全文）
    const body = {
      model: modelName,
      messages: messages,
      tools: tools,
      max_tokens: 4096,
      stream: true
    };

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 120000);

    try {
      const response = await fetch(config.apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + providerKey },
        body: JSON.stringify(body),
        signal: controller.signal
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(t("{label} 请求失败({status}): {err}", { label: config.shortLabel, status: response.status, err: errText.slice(0, 180) }));
      }

      // 使用即续期：本次调用成功，把该服务商的 API Key Cookie 有效期重新延长到 30 天
      touchProviderCookie(providerId);

      // --- Streaming mode ---
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let accumulatedContent = "";
      const toolCalls = {}; // index -> { name, arguments }

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith("data: ")) continue;
          const data = trimmed.slice(6);
          if (data === "[DONE]") continue;

          try {
            const parsed = JSON.parse(data);
            const delta = parsed.choices && parsed.choices[0] ? parsed.choices[0].delta : null;
            if (!delta) continue;

            // Content delta
            if (delta.content) {
              accumulatedContent += delta.content;
              if (onChunk) onChunk({ content: accumulatedContent, tool_calls: null });
            }

            // Tool call delta
            if (delta.tool_calls) {
              for (const tc of delta.tool_calls) {
                const idx = tc.index;
                if (!toolCalls[idx]) toolCalls[idx] = { id: tc.id || "", function: { name: "", arguments: "" } };
                if (tc.id) toolCalls[idx].id = tc.id;
                if (tc.function) {
                  if (tc.function.name) toolCalls[idx].function.name += tc.function.name;
                  if (tc.function.arguments) toolCalls[idx].function.arguments += tc.function.arguments;
                }
                if (onChunk) onChunk({
                  content: accumulatedContent,
                  tool_calls: Object.values(toolCalls).filter(tc => tc.function.name)
                });
              }
            }
          } catch (e) { /* skip malformed lines */ }
        }
      }

      // Build final message
      const toolCallsArr = Object.values(toolCalls).filter(tc => tc.function.name);
      const message = { role: "assistant" };
      if (accumulatedContent) message.content = accumulatedContent;
      if (toolCallsArr.length > 0) message.tool_calls = toolCallsArr;
      return { message, finishReason: "stop" };
    } finally {
      clearTimeout(timer);
    }
  }

  function buildCardDescription(card) {
    if (!card.suit) return card.rank;
    let desc = card.suit + card.rank;
    if (game.isWildCard(card)) desc += t("(逢人配)");
    else if (game.isLevelCard(card)) desc += t("(级牌)");
    return desc;
  }

  // ---------- Rendering ----------
  function cardClasses(card) {
    const cls = [];
    if (game.isWildCard(card)) cls.push("wild-card");
    else if (game.isLevelCard(card)) cls.push("level-card");
    if (!card.suit) {
      // Joker
      cls.push(card.rank === "大王" ? "joker-red" : "joker-black");
    } else if (game.isRedSuit(card)) {
      cls.push("red");
    } else {
      cls.push("black");
    }
    return cls.join(" ");
  }

  function renderCard(card, sizeClass) {
    const cls = sizeClass || "";
    if (!card) return "";
    if (card.rank === "大王") {
      return `<span class="card ${cls} joker-red" title="${t("大王")}" data-card-id="${card.id}"><span class="rank">大<br>王</span></span>`;
    }
    if (card.rank === "小王") {
      return `<span class="card ${cls} joker-black" title="${t("小王")}" data-card-id="${card.id}"><span class="rank">小<br>王</span></span>`;
    }
    const extraCls = cardClasses(card);
    const wildTag = game.isWildCard(card) ? '<span class="wild-tag">配</span>' : '';
    const isWild = game.isWildCard(card);
    const isLvl = game.isLevelCard(card) && !isWild;
    return `<span class="card ${cls} ${extraCls}" title="${card.suit}${card.rank}${isWild ? ' ' + t('逢人配') : ''}${isLvl ? ' ' + t('级牌') : ''}" data-card-id="${card.id}"><span class="rank">${card.rank}</span><span class="suit">${card.suit||''}</span>${wildTag}</span>`;
  }

  function renderCardBack(sizeClass) {
    return `<span class="card card-back ${sizeClass || ''}"></span>`;
  }

  function renderPlayerCards(playerIdx) {
    const player = game.players[playerIdx];
    const seatId = ["cardsBottom", "cardsRight", "cardsTop", "cardsLeft"][playerIdx];
    const $container = $("#" + seatId);

    updateSeatInfo();

    const isBottom = playerIdx === 0;
    const sizeCls = (isBottom && player.isHuman) ? "" : "mini";
    // 南侧牌摞始终向上延伸（仅渲染南侧时设置，渲染其他位置不触碰）
    if (isBottom) $("#cardsBottom").addClass("piles-up");

    // If no piles, show simple sorted cards
    if (player.piles.length === 0) {
      const sorted = game.sortCards(player.cards);
      $container.html(sorted.map(c => renderCard(c, sizeCls)).join(""));
      return;
    }

    // Has piles: render piles + loose cards
    const piledIds = new Set(player.piles.flatMap(p => p.cardIds));
    const sorted = game.sortCards(player.cards);
    const looseCards = sorted.filter(c => !piledIds.has(c.id));

    let html = "";
    player.piles.forEach((p, pileIdx) => {
      const pileCards = p.cardIds.map(id => player.cards.find(c => c.id === id)).filter(c => c);
      if (pileCards.length === 0) return;
      const sortedPile = game.sortCards(pileCards);
      const isPileSelected = isBottom && p.cardIds.every(id => selectedCards.includes(id));
      const selCls = isPileSelected ? " selected" : "";
      html += `<span class="card-pile${selCls}" data-pile-idx="${pileIdx}">`;
      sortedPile.forEach(c => {
        html += renderCard(c, sizeCls);
      });
      html += `</span>`;
    });
    looseCards.forEach(c => {
      html += renderCard(c, sizeCls);
    });
    $container.html(html);
  }

  function renderAllPlayers() {
    for (let i = 0; i < 4; i++) {
      renderPlayerCards(i);
    }
  }

  function renderMiniCard(card) {
    if (card.rank === "大王") {
      return `<span class="play-card-mini joker-red" title="${t("大王")}"><span class="rank">大</span></span>`;
    }
    if (card.rank === "小王") {
      return `<span class="play-card-mini joker-black" title="${t("小王")}"><span class="rank">小</span></span>`;
    }
    const colorCls = (card.suit === "♥" || card.suit === "♦") ? "red" : "black";
    let extraCls = "";
    if (game.isWildCard(card)) extraCls = " wild-card";
    else if (game.isLevelCard(card)) extraCls = " level-card";
    const isWild = game.isWildCard(card);
    return `<span class="play-card-mini ${colorCls}${extraCls}" title="${card.suit}${card.rank}${isWild ? ' ' + t('逢人配') : ''}"><span class="rank">${card.rank}</span><span class="suit">${card.suit||''}</span></span>`;
  }

  function renderRoundHistory() {
    const $area = $("#playArea");
    const $history = $("#roundHistory");
    if (game.roundHistory.length === 0) {
      $history.html("");
      return;
    }
    // Group by round (split at round resets)
    const rounds = [];
    let currentRound = [];
    for (const entry of game.roundHistory) {
      currentRound.push(entry);
      if (entry.newRoundAfter) {
        rounds.push(currentRound);
        currentRound = [];
      }
    }
    if (currentRound.length > 0) rounds.push(currentRound);

    let html = "";
    for (let r = 0; r < rounds.length; r++) {
      html += `<div class="round-row"><span class="round-number">${r + 1}</span>`;
      for (const entry of rounds[r]) {
        const who = game.players[entry.playerIdx].name;
        if (entry.cards === null) {
          html += `<div class="round-play-entry pass-entry"><span class="play-who">${who}</span><span class="play-pass">${t("不要")}</span></div>`;
        } else {
          const cardsHtml = entry.cards.map(c => renderMiniCard(c)).join("");
          html += `<div class="round-play-entry"><span class="play-who">${who}</span><span class="play-cards">${cardsHtml}</span></div>`;
        }
      }
      html += '</div>';
    }
    $history.html(html);
    $area.scrollTop($area[0].scrollHeight);
  }

  function renderLevelBadge() {
    $("#levelBadge").text(t("本局打 {rank}", { rank: game.levelRank }));
  }

  function updateCurrentPlayerIndicator() {
    const nameIds = ["#nameBottom", "#nameRight", "#nameTop", "#nameLeft"];
    nameIds.forEach((id, i) => {
      $(id).toggleClass("current-turn", i === game.currentPlayer);
    });

    // Show/hide per-seat action buttons
    $(".seat-actions").each(function() {
      const pos = parseInt($(this).data("position"));
      const isHumanSeat = seatConfig[pos] && seatConfig[pos].type === "human";
      const isMyTurn = pos === game.currentPlayer;
      const gameActive = !game.finished && game.started;
      // Always show for human seat during game; play/pass only when it's their turn
      const show = isHumanSeat && gameActive;
      $(this).toggle(!!show);

      if (show) {
        const $actions = $(this);
        if (isMyTurn) {
          $actions.find(".pass-btn").prop("disabled", !game.lastPlay || game.lastPlay.playerIdx === pos).show();
          $actions.find(".play-selected-btn").prop("disabled", true).show();
        } else {
          $actions.find(".pass-btn").hide();
          $actions.find(".play-selected-btn").hide();
        }
        $actions.find(".pile-btn").prop("disabled", true);
        $actions.find(".unpile-btn").prop("disabled", true);
      }
    });

    // Always update pile/play buttons for human bottom seat during game
    if (game.started && !game.finished && seatConfig[0] && seatConfig[0].type === "human") {
      updatePileButtons();
      updatePlayButton();
    }
  }

  // ---------- Logging ----------
  function addLog(msg) {
    console.log("[" + t("掼蛋") + "]", msg);
  }

  // ---------- Human actions ----------
  let selectedCards = [];

  function toggleCardSelection(cardId) {
    const idx = selectedCards.indexOf(cardId);
    if (idx >= 0) {
      selectedCards.splice(idx, 1);
    } else {
      selectedCards.push(cardId);
    }
    updateCardSelectionUI();
    updatePileButtons();
    updatePlayButton();
  }

  function updateCardSelectionUI() {
    const player = game.players[0]; // Always human seat
    const $cards = $("#cardsBottom .card");
    $cards.each(function() {
      const $card = $(this);
      const cardId = $card.data("card-id");
      $card.toggleClass("selected", selectedCards.includes(cardId));
    });
    // Update pile selection state
    $("#cardsBottom .card-pile").each(function() {
      const pileIdx = parseInt($(this).data("pile-idx"));
      const pile = player.piles[pileIdx];
      if (pile) {
        const allSelected = pile.cardIds.every(id => selectedCards.includes(id));
        $(this).toggleClass("selected", allSelected);
      }
    });
  }

  function updatePlayButton() {
    const pos = game.currentPlayer;
    if (selectedCards.length === 0) {
      $(`.play-selected-btn[data-position="${pos}"]`).prop("disabled", true);
      return;
    }
    const player = game.players[pos];
    const cards = player.cards.filter(c => selectedCards.includes(c.id));
    const analysis = game.analyzeCards(cards);
    if (!analysis) {
      $(`.play-selected-btn[data-position="${pos}"]`).prop("disabled", true);
      return;
    }
    if (game.lastPlay && game.lastPlay.playerIdx !== pos) {
      if (!game.canBeat(analysis, game.lastPlay.analysis)) {
        $(`.play-selected-btn[data-position="${pos}"]`).prop("disabled", true);
        return;
      }
    }
    $(`.play-selected-btn[data-position="${pos}"]`).prop("disabled", false);
  }

  function updatePileButtons() {
    const pos = 0; // Always operate on human seat
    const human = game.players[pos];
    const gameActive = game.started && !game.finished;
    if (!gameActive || !human || !human.isHuman || selectedCards.length === 0) {
      $(`.pile-btn[data-position="${pos}"]`).prop("disabled", true);
      $(`.unpile-btn[data-position="${pos}"]`).prop("disabled", true);
      return;
    }
    const cards = human.cards.filter(c => selectedCards.includes(c.id));
    const analysis = game.analyzeCards(cards);
    $(`.pile-btn[data-position="${pos}"]`).prop("disabled", !analysis || analysis.type === "single");
    const anyPileSelected = human.piles.some(p => p.cardIds.every(id => selectedCards.includes(id)));
    $(`.unpile-btn[data-position="${pos}"]`).prop("disabled", !anyPileSelected);
  }

  function renderAll() {
    renderAllPlayers();
    renderRoundHistory();
    updateCurrentPlayerIndicator();
  }

  // ---------- 座位配置 UI ----------
  // 根据 seatConfig 渲染每个座位的 类型/服务商/模型 下拉框（改变即时保存到 localStorage）
  function renderSeatConfigControls() {
    const available = getAvailableProviders();
    for (let i = 0; i < 4; i++) {
      const cfg = seatConfig[i] || { type: "human", providerId: "", modelName: "" };
      const $type = $("#cfgSeat" + i);
      const $prov = $("#cfgSeat" + i + "Provider");
      const $model = $("#cfgSeat" + i + "Model");

      $type.val(cfg.type);
      // 东/北/西座位强制 AI：类型下拉框不可改（HTML 中已移除「人」选项）
      $type.prop("disabled", i > 0);

      $prov.empty();
      if (!available.length) {
        $prov.append('<option value="">' + t("无可用 Key") + '</option>');
        $model.empty().append('<option value="">' + t("先去配置 Key") + '</option>');
        $prov.prop("disabled", true);
        $model.prop("disabled", true);
        continue;
      }
      available.forEach(id => {
        $prov.append('<option value="' + id + '">' + getProviderShortLabel(id) + '</option>');
      });
      let providerId = cfg.providerId;
      if (!providerId || !getProviderApiKey(providerId)) providerId = available[0];
      $prov.val(providerId);

      const pcfg = getProviderConfig(providerId);
      $model.empty();
      (pcfg ? pcfg.modelOptions : []).forEach(m => {
        $model.append('<option value="' + m.value + '">' + m.label + '</option>');
      });
      let modelName = cfg.modelName;
      if (!modelName || !pcfg || !pcfg.modelOptions.some(m => m.value === modelName)) {
        modelName = pcfg ? pcfg.defaultModel : "";
      }
      $model.val(modelName);

      const isAI = cfg.type === "ai";
      $prov.prop("disabled", !isAI);
      $model.prop("disabled", !isAI);
    }
  }

  // ---------- Event bindings ----------
  $(function() {
    // 初始化座位配置 UI（从 localStorage 恢复上次配置）
    renderSeatConfigControls();

    // 座位类型切换（人 / AI）：保存并重渲染该座位的模型下拉
    $(".seat-type").on("change", function() {
      readSeatConfig();
      renderSeatConfigControls();
      updateSeatInfo();
    });

    // 座位服务商切换：自动带上该服务商默认模型
    $(".seat-provider").on("change", function() {
      readSeatConfig();
      renderSeatConfigControls();
    });

    // 座位模型切换：即时保存
    $(".seat-model").on("change", function() {
      readSeatConfig();
    });

    $("#newGameBtn").on("click", async function() {
      readSeatConfig();
      renderSeatConfigControls();
      // 逐座位校验：AI 座位必须有可用的大模型
      const aiSeatIdx = [];
      for (let i = 0; i < 4; i++) {
        if (seatConfig[i] && seatConfig[i].type === "ai") aiSeatIdx.push(i);
      }
      if (aiSeatIdx.length > 0) {
        if (!getAvailableProviders().length) {
          showToast(t("AI 座位需要大模型才能运行。请先到「配置页」填写至少一家服务商的 API Key。"), { seconds: 4, suffix: "" });
          return;
        }
        for (const i of aiSeatIdx) {
          if (!getSeatAiConfig(i)) {
            showToast(t("座位「{name}」配置为 AI，但没有可用的模型配置，请检查其服务商选择。", { name: SEAT_NAMES[i] }), { seconds: 4, suffix: "" });
            return;
          }
        }
      }
      updateSeatInfo();
      selectedCards = [];
      game.startNewGame();
      $("#gameStatus").text(t("游戏中")).css("color", "");
      $("#newGameBtn").text(t("新一局")).prop("disabled", false);
      renderLevelBadge();
      renderAll();

      // 通知所有 AI 玩家开始组牌（后台进行，不阻塞游戏开始）
      const aiPlayers = game.players.filter(p => p instanceof LLMAIPlayer);
      if (aiPlayers.length > 0) {
        addLog(t("AI 玩家开始组牌…"));
        aiPlayers.forEach(p => {
          p.prepareHand(game, "initial").then(() => {
            if (!p.preparing) {
              addLog(t("{name} 组牌完成", { name: p.name }));
            }
          });
        });
      }

      // Auto-start
      setTimeout(async () => { await game.aiPlay(); }, 600);
    });

    // --- 结局仪式弹层 ---
    $("#victoryRestartBtn").on("click", function() {
      hideVictoryModal();
      $("#newGameBtn").trigger("click");
    });
    $("#victoryCloseBtn").on("click", hideVictoryModal);
    // 点击遮罩（卡片以外）关闭
    $("#victoryOverlay").on("click", function(e) {
      if (e.target === this) hideVictoryModal();
    });
    // Esc 关闭
    $(document).on("keydown", function(e) {
      if (e.key === "Escape" && $("#victoryOverlay").hasClass("show")) hideVictoryModal();
    });

    // --- AI conversation panel ---
    $(document).on("click", ".ai-badge", function(e) {
      e.stopPropagation();
      const pos = parseInt($(this).data("position"));
      showAIPanel(pos);
    });

    $("#aiPanelClose").on("click", hideAIPanel);

    $("#aiPanelCopyLog").on("click", function() {
      if (aiPanelPlayerIdx < 0) return;
      const player = game.players[aiPanelPlayerIdx];
      if (!player || !(player instanceof LLMAIPlayer) || player.decisionLog.length === 0) {
        showToast(t("暂无操作日志"), { seconds: 2, suffix: "" });
        return;
      }
      let text = t("=== {name} 操作日志 ===\n", { name: player.name });
      text += t("手牌数量: {n}\n", { n: player.cards.length });
      if (player.piles.length > 0) {
        text += t("当前牌摞:\n");
        player.piles.forEach((p, i) => {
          const cards = p.cardIds.map(id => player.cards.find(c => c.id === id)).filter(c => c);
          text += t("  摞{i}: {cards}\n", { i, cards: cards.map(c => c.suit + c.rank).join(" ") });
        });
      }
      text += t("\n--- 操作记录 ---\n");
      player.decisionLog.forEach((entry, i) => {
        text += `\n[${entry.time}] ${entry.action}\n`;
        text += t("  参数: {v}\n", { v: JSON.stringify(entry.params) });
        text += t("  结果: {v}\n", { v: JSON.stringify(entry.result) });
      });
      navigator.clipboard.writeText(text).then(() => {
        const $btn = $("#aiPanelCopyLog");
        $btn.text("✓");
        setTimeout(() => $btn.text(t("复制")), 1500);
      }).catch(() => showToast(t("复制失败"), { seconds: 2, suffix: "" }));
    });

    // Chat send button
    $("#aiPanelChatSend").on("click", sendChatMessage);

    // Chat input Enter key
    $("#aiPanelChatInput").on("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        sendChatMessage();
      }
    });

    // Click outside panel to close
    $(document).on("click", function(e) {
      if ($("#aiPanel").is(":visible") && !$(e.target).closest("#aiPanel").length && !$(e.target).closest(".ai-badge").length) {
        hideAIPanel();
      }
    });

    // --- Per-seat action buttons (class-based) ---

    // Pass button
    $(document).on("click", ".pass-btn", function() {
      const pos = parseInt($(this).data("position"));
      if (pos !== game.currentPlayer) return;
      if (!game.players[pos].isHuman || game.finished) return;
      game.pass(pos);
    });

    // Play selected button (bottom seat only - manual card selection)
    $(document).on("click", ".play-selected-btn", function() {
      const pos = parseInt($(this).data("position"));
      if (pos !== game.currentPlayer) return;
      if (!game.players[pos].isHuman || game.finished) return;
      const player = game.players[pos];
      const cards = player.cards.filter(c => selectedCards.includes(c.id));
      if (cards.length === 0) return;
      const analysis = game.analyzeCards(cards);
      if (!analysis) {
        addLog(t("无效的牌型组合，请重新选择（提示：逢人配可以帮你凑牌型）"));
        return;
      }
      if (game.lastPlay && game.lastPlay.playerIdx !== pos &&
          !game.canBeat(analysis, game.lastPlay.analysis)) {
        addLog(t("所选牌型打不过上家的牌，请重新选择或过牌"));
        return;
      }
      selectedCards = [];
      game.play(pos, cards);
    });

    // Card click selection (bottom seat only, works any time during game)
    $(document).on("click", "#cardsBottom .card", function() {
      const human = game.players[0];
      if (!human || !human.isHuman || game.finished || !game.started) return;
      // If inside a pile, toggle the whole pile
      const $pile = $(this).closest(".card-pile");
      if ($pile.length) {
        const pileIdx = parseInt($pile.data("pile-idx"));
        const pile = human.piles[pileIdx];
        if (!pile) return;
        const allSelected = pile.cardIds.every(id => selectedCards.includes(id));
        if (allSelected) {
          selectedCards = selectedCards.filter(id => !pile.cardIds.includes(id));
        } else {
          pile.cardIds.forEach(id => {
            if (!selectedCards.includes(id)) selectedCards.push(id);
          });
        }
        updateCardSelectionUI();
        updatePileButtons();
        updatePlayButton();
        return;
      }
      // Loose card click: toggle individual selection
      const cardId = $(this).data("card-id");
      if (cardId) toggleCardSelection(cardId);
    });

    $(document).on("click", "#cardsBottom .card-pile", function(e) {
      const human = game.players[0];
      if (!human || !human.isHuman || game.finished || !game.started) return;
      // Only handle click on the pile area between cards
      if ($(e.target).closest(".card").length) return;
      const pileIdx = parseInt($(this).data("pile-idx"));
      const pile = human.piles[pileIdx];
      if (!pile) return;
      const allSelected = pile.cardIds.every(id => selectedCards.includes(id));
      if (allSelected) {
        selectedCards = selectedCards.filter(id => !pile.cardIds.includes(id));
      } else {
        pile.cardIds.forEach(id => {
          if (!selectedCards.includes(id)) selectedCards.push(id);
        });
      }
      updateCardSelectionUI();
      updatePileButtons();
      updatePlayButton();
    });

    // Pile button
    $(document).on("click", ".pile-btn", function() {
      const pos = parseInt($(this).data("position"));
      if (!game.players[pos] || !game.players[pos].isHuman || game.finished || !game.started) return;
      const player = game.players[pos];
      const cards = player.cards.filter(c => selectedCards.includes(c.id));
      if (cards.length === 0) return;
      const analysis = game.analyzeCards(cards);
      if (!analysis || analysis.type === "single") {
        addLog(!analysis ? t("所选牌无法组成有效牌型") : t("单张牌无需理牌"));
        return;
      }
      player.pileCards(cards.map(c => c.id));
      selectedCards = [];
      updateCardSelectionUI();
      updatePileButtons();
      updatePlayButton();
      renderPlayerCards(pos);
      addLog(t("理牌：将 {n} 张牌组成一摞（{type}）", { n: cards.length, type: TYPE_NAMES[analysis.type] }));
    });

    // Unpile button
    $(document).on("click", ".unpile-btn", function() {
      const pos = parseInt($(this).data("position"));
      if (!game.players[pos] || !game.players[pos].isHuman || game.finished || !game.started) return;
      const player = game.players[pos];
      const toRemove = [];
      player.piles.forEach((p, i) => {
        if (p.cardIds.every(id => selectedCards.includes(id))) {
          toRemove.push(i);
          selectedCards = selectedCards.filter(id => !p.cardIds.includes(id));
        }
      });
      if (toRemove.length === 0) return;
      toRemove.sort((a,b) => b-a).forEach(i => player.piles.splice(i, 1));
      updateCardSelectionUI();
      updatePileButtons();
      updatePlayButton();
      renderPlayerCards(pos);
    });

    // 初始状态：恢复上次座位配置（localStorage），等待开始
    renderSeatConfigControls();
    if (!getAvailableProviders().length) {
      // 一个模型都没配置：toast 提示（带倒计时），几秒后自动跳转配置页
      showToast(t("还没有配置任何模型 Key —— "), {
        seconds: 5,
        onDone: function () { location.href = "config.html"; }
      });
    }
    updateSeatInfo();
    renderLevelBadge();
  });

  // 轻量 toast：无配置提示用，支持倒计时 + 自动跳转
  // 用法：showToast("提示文字", { seconds: 5, onDone: fn })
  function showToast(text, opts) {
    opts = opts || {};
    const seconds = opts.seconds || 3;
    let $t = $("#gdToast");
    if (!$t.length) {
      $t = $('<div id="gdToast" class="gd-toast"></div>').appendTo("body");
    }
    // 清理上一次的计时器与进度条
    clearInterval(showToast._timer);
    clearTimeout(showToast._toDone);
    $t.find(".gd-bar").remove();
    $t.find(".gd-count").remove();

    // 倒计时圆点 + 底部进度条
    let left = seconds;
    const $count = $('<span class="gd-count"></span>').text(left);
    $t.empty().append(document.createTextNode(text)).append($count)
      .append(document.createTextNode(opts.suffix !== undefined ? opts.suffix : t(" 秒后自动前往配置页")))
      .append('<div class="gd-bar" style="animation-duration:' + seconds + 's"></div>')
      .addClass("show");

    showToast._timer = setInterval(function () {
      left--;
      if (left <= 0) {
        clearInterval(showToast._timer);
        $t.removeClass("show");
        if (typeof opts.onDone === "function") {
          showToast._toDone = setTimeout(opts.onDone, 260); // 等淡出动画
        }
        return;
      }
      $count.text(left);
    }, 1000);
  }
</script>
