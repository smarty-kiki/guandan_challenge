  // ==================== LLMAIPlayerFactory AI 初始化类 ====================
  class LLMAIPlayerFactory {
    constructor(providerId, modelName, systemPrompt) {
      this.providerId = providerId;
      this.modelName = modelName;
      this.systemPrompt = Array.isArray(systemPrompt) ? systemPrompt.join("\n") : systemPrompt;
    }

    createPlayer(name, team, position) {
      return new LLMAIPlayer(name, team, position, this.providerId, this.modelName, this.systemPrompt);
    }
  }

  // ==================== LLMAIPlayer LLM AI 玩家 ====================
  class LLMAIPlayer extends Player {
    constructor(name, team, position, providerId, modelName, systemPrompt) {
      super(name, team, position, false);
      this.providerId = providerId;
      this.modelName = modelName;
      this.systemPrompt = Array.isArray(systemPrompt) ? systemPrompt.join("\n") : systemPrompt;
      this.messages = [];      // 独立对话上下文
      this.maxTurns = 50;      // 最大思考轮次
      this.preparing = false;  // 是否正在组牌
      this.thinking = false;   // 是否正在思考出牌
      this.chatting = false;   // 是否正在回复用户聊天
      this._prepResolve = null;
      this._chatResolve = null; // 聊天锁：decidePlay/prepareHand 等待聊天结束
      this._lastCompression = null; // 上下文压缩信息 { keptFrom, removed, time, _shown }
      this.decisionLog = [];   // 组牌/出牌操作日志
    }

    _alertBug(msg) {
      const fullMsg = t("[疑似 BUG] {name}：{msg}", { name: this.name, msg });
      addLog(fullMsg);
      alert(fullMsg);
    }

    _logDecision(action, params, result) {
      const entry = {
        time: new Date().toLocaleTimeString(),
        action,
        params: JSON.parse(JSON.stringify(params)),
        result: JSON.parse(JSON.stringify(result))
      };
      this.decisionLog.push(entry);
    }

    // ---------- 构建 API 消息列表（含上下文压缩） ----------
    // 返回压缩后的消息数组，不修改 this.messages（全量历史，用于面板展示）
    _buildAPIMessages(game) {
      // 各模型上下文大小不同（32K～1M token，见 common.js getModelContextSize）：
      // 估算当前用量，一旦超过该模型上下文的一半，就开始压缩历史，
      // 避免小上下文模型被长对话撑爆，也让大上下文模型尽量保留完整过程
      const ctxSize = getModelContextSize(this.providerId, this.modelName);
      const MAX_CHARS = Math.floor(ctxSize * 0.5 * 2); // ~2 字符 ≈ 1 token
      const KEEP_RECENT = 25;    // 压缩后最少保留最近消息数

      let totalChars = 0;
      for (const m of this.messages) {
        const c = typeof m.content === "string" ? m.content : JSON.stringify(m.content || "");
        totalChars += c.length;
      }
      if (totalChars < MAX_CHARS) {
        return this.messages;
      }

      // 找到安全截断点：必须在 user 消息边界，避免切断 tool_call/tool_result 配对
      let keepFrom = Math.max(1, this.messages.length - KEEP_RECENT);
      while (keepFrom > 1 && this.messages[keepFrom].role !== "user") {
        keepFrom--;
      }
      if (keepFrom <= 1) return this.messages;

      const systemMsg = this.messages[0];
      const recent = this.messages.slice(keepFrom);
      const removed = keepFrom - 1;
      const summary = {
        role: "user",
        content: t("[上下文压缩] 此前 {removed} 条对话已省略。当前打 {rank}，红心{rank} 是逢人配。你仍在掼蛋游戏中，请继续按规则决策。", { removed, rank: game.levelRank })
      };

      // 记录压缩信息供面板展示
      this._lastCompression = { keptFrom: keepFrom, removed, time: Date.now() };

      return [systemMsg, summary, ...recent];
    }

    // ---------- Tool call ID 自修复 ----------
    // 双向修复：孤立的 tool result 和 缺失 result 的 assistant tool_call
    _fixupToolCalls() {
      const toRemove = new Set();

      // Pass 1: 收集 assistant tool_calls 及其索引、声明的 tool_call_id
      const assistantCalls = []; // { index, ids: [] }
      const validIds = new Set();
      for (let i = 0; i < this.messages.length; i++) {
        const m = this.messages[i];
        if (m.role === "assistant" && Array.isArray(m.tool_calls) && m.tool_calls.length > 0) {
          const ids = [];
          for (const tc of m.tool_calls) {
            if (tc.id) { validIds.add(tc.id); ids.push(tc.id); }
          }
          assistantCalls.push({ index: i, ids });
        }
      }

      // Pass 2: 找孤立的 tool result（tool_call_id 无匹配的 assistant）
      for (let i = 0; i < this.messages.length; i++) {
        const m = this.messages[i];
        if (m.role === "tool" && m.tool_call_id && !validIds.has(m.tool_call_id)) {
          toRemove.add(i);
        }
      }

      // Pass 3: 找不完整的 assistant（有 tool_calls 但某些 result 缺失）
      for (const ac of assistantCalls) {
        let missing = false;
        for (const tid of ac.ids) {
          const hasResult = this.messages.some((m, i) =>
            m.role === "tool" && m.tool_call_id === tid && !toRemove.has(i)
          );
          if (!hasResult) { missing = true; break; }
        }
        if (missing) {
          toRemove.add(ac.index);
          // 同时标记该 assistant 对应的残留 tool result（如果有的话）
          for (const tid of ac.ids) {
            for (let i = 0; i < this.messages.length; i++) {
              if (this.messages[i].role === "tool" && this.messages[i].tool_call_id === tid) {
                toRemove.add(i);
              }
            }
          }
        }
      }

      if (toRemove.size === 0) return 0;

      // 从后往前删
      const sorted = [...toRemove].sort((a, b) => b - a);
      for (const idx of sorted) {
        this.messages.splice(idx, 1);
      }
      addLog(t("[LLM AI] {name} 自修复：移除 {n} 条不匹配的 tool 消息", { name: this.name, n: toRemove.size }));
      this._lastCompression = null;
      return toRemove.size;
    }

    // 判断错误是否与 tool call ID 相关（tool call 与 tool result 配对失败）
    _isToolIdError(errMsg) {
      const msg = String(errMsg || "").toLowerCase();
      if (!msg.includes("tool")) return false;
      // MiniMax: "tool call result does not follow tool call (2013)"
      if (msg.includes("does not follow tool call") || msg.includes("does not follow")) return true;
      // 通用: tool call/tool result 配对错误，带错误码 2013
      if (msg.includes("tool") && msg.includes("(2013)")) return true;
      // 通用: tool call/tool result/ID 未找到
      if ((msg.includes("tool call") || msg.includes("tool result") || msg.includes("tool id") || msg.includes("tool_call_id")) && (msg.includes("not found") || msg.includes("not_found") || msg.includes("not follow"))) return true;
      return false;
    }

    // ---------- 组牌：reason="initial" 开局 / "post_play" 出牌后 ----------
    async prepareHand(game, reason) {
      if (game.finished || this.cards.length === 0) return;
      // 循环等待，直到聊天和组牌都完成（每次 await 后重新检查，防止等待期间新操作插入）
      while (this._chatPromise || (this.preparing && this._prepPromise)) {
        if (this._chatPromise) await this._chatPromise;
        if (this.preparing && this._prepPromise) await this._prepPromise;
      }
      this.preparing = true;
      this._prepPromise = new Promise(resolve => { this._prepResolve = resolve; });
      // 初始化对话
      if (this.messages.length === 0) {
        this.messages.push({ role: "system", content: this.systemPrompt });
      }

      const initMsg = reason === "initial"
        ? [
            t("发牌已完成。请用 view_hand 查看手牌，按你自己的想法整理牌型。"),
            t("当前打 {rank}，红心{rank} 是逢人配。手牌共 {n} 张。", { rank: game.levelRank, n: this.cards.length }),
            t("提示：你可以先调用 read_experience 工具查看过往对局的经验记录，帮助本局决策。"),
            t("【重要】组牌完成后必须明确回复文字确认（如'组牌完成'或总结组牌结果），在此之前系统会一直等待你完成组牌。"),
            t("组牌阶段不要调用 play_cards 或 pass_turn。")
          ].join("\n")
        : t("【后台理牌】你刚出完牌/过牌，可以利用等待时间重新审视手牌组织。用 pile_cards（推荐 groups）或 unpile_cards 调整牌摞。完成后回复 {\"task\":\"prep\",\"complete\":true}。");

      this.messages.push({ role: "user", content: initMsg });
      updateSeatInfo();
      renderPlayerCards(this.position);
      notifyAIPanel(this.position);

      let consecutiveErrors = 0;
      try {
        while (true) {
          try {
          // 始终传回调以便流式请求；是否显示在分块到达时判断（面板中途打开也能接上）
          const onChunk = (chunk) => {
            if (aiPanelPlayerIdx === this.position) renderStreamingChunk(chunk);
          };
          const response = await callLLMWithMessages(
            this._buildAPIMessages(game), GUANDAN_TOOLS, this.providerId, this.modelName, onChunk
          );
          const msg = response.message;
          consecutiveErrors = 0;

          if (msg.tool_calls && msg.tool_calls.length > 0) {
            this.messages.push(msg);
            for (const tc of msg.tool_calls) {
              const fnName = tc.function.name;
              if (fnName === "play_cards" || fnName === "pass_turn") {
                this.messages.push({
                  role: "tool", tool_call_id: tc.id,
                  content: JSON.stringify({ error: t("组牌阶段不能出牌或过牌") })
                });
              } else {
                let args = {};
                try { args = JSON.parse(tc.function.arguments || "{}"); } catch (e) {}
                let result;
                try { result = await this._dispatchTool(fnName, args, game); } catch (e) { result = { error: t("工具异常：{e}", { e: e.message }) }; }
                this.messages.push({ role: "tool", tool_call_id: tc.id, content: JSON.stringify(result) });
              }
            }
            notifyAIPanel(this.position);
            renderPlayerCards(this.position);
            continue;
          }

          const content = extractContentText(msg.content);
          const status = parseTaskStatus(content);
          this.messages.push(msg);

          // 拒绝 play 任务类型（当前是组牌阶段，不是出牌阶段）
          if (status && status.task === "play") {
            this.messages.push({
              role: "user",
              content: t("当前是组牌阶段，不是出牌阶段。请使用 {\"task\":\"prep\",\"complete\":true} 格式。组牌阶段不要调用 play_cards 或 pass_turn。")
            });
            notifyAIPanel(this.position);
            continue;
          }

          if (status && status.complete) {
            addLog(t("{name} 组牌完成", { name: this.name }));
            notifyAIPanel(this.position);
            renderPlayerCards(this.position);
            return;
          }

          const hint = status
            ? t("收到，任务状态为未完成。请继续整理牌型，完成后将 complete 设为 true。")
            : t("未找到任务状态 JSON。请继续组牌，并在回复末尾添加：{\"task\":\"prep\",\"complete\":true}。");
          this.messages.push({ role: "user", content: hint });
          notifyAIPanel(this.position);
        } catch (e) {
          // Tool call ID 相关错误：自修复后重试
          if (this._isToolIdError(e.message)) {
            const removed = this._fixupToolCalls();
            if (removed > 0) {
              addLog(t("{name} 组牌时检测到 tool call ID 不匹配，已清理 {n} 条孤立的 tool 消息", { name: this.name, n: removed }));
              this.messages.push({
                role: "user",
                content: t("检测到上下文 tool call 不匹配，已自动清理 {n} 条孤立的 tool 消息。请继续组牌，用 view_hand 查看手牌。完成后回复 {\"task\":\"prep\",\"complete\":true}。", { n: removed })
              });
              notifyAIPanel(this.position);
              continue;
            }
          }
          consecutiveErrors++;
          addLog(t("{name} 组牌出错（第{n}次）：{e}", { name: this.name, n: consecutiveErrors, e: e.message }));
          if (consecutiveErrors >= 5) {
            addLog(t("{name} 连续出错超过5次，放弃组牌", { name: this.name }));
            return;
          }
          await new Promise(r => setTimeout(r, 2000));
          this.messages.push({
            role: "user",
            content: t("刚才请求出错（{e}），请继续组牌。用 view_hand 查看手牌，用 pile_cards 整理。完成后回复 {\"task\":\"prep\",\"complete\":true}。", { e: e.message })
          });
          notifyAIPanel(this.position);
        }
      }
      } finally {
        this.preparing = false;
        if (this._prepResolve) { this._prepResolve(); this._prepResolve = null; }
        updateSeatInfo();
        renderPlayerCards(this.position);
        tryProcessChatQueue();
      }
    }

    // ---------- 主入口：多轮 LLM 决策 ----------
    async decidePlay(game) {
      if (game.finished || this.cards.length === 0) return;
      // 循环等待，直到聊天和组牌都完成（每次 await 后重新检查，防止等待期间新操作插入）
      while (this._chatPromise || (this.preparing && this._prepPromise)) {
        if (this._chatPromise) await this._chatPromise;
        if (this.preparing && this._prepPromise) await this._prepPromise;
      }
      this.thinking = true;
      updateSeatInfo();
      try {
      // 首次调用时初始化对话
      if (this.messages.length === 0) {
        this.messages.push({ role: "system", content: this.systemPrompt });
      }

      // 添加当前局面描述
      this.messages.push({ role: "user", content: this._buildSituation(game) });
      notifyAIPanel(this.position);

      const onChunk = (chunk) => {
        if (aiPanelPlayerIdx === this.position) {
          renderStreamingChunk(chunk);
        }
      };

      let turnCount = 0;
      while (turnCount < this.maxTurns) {
        turnCount++;
        try {
          const response = await callLLMWithMessages(
            this._buildAPIMessages(game), GUANDAN_TOOLS, this.providerId, this.modelName, onChunk
          );
          const msg = response.message;

          // 有 tool calls
          if (msg.tool_calls && msg.tool_calls.length > 0) {
            this.messages.push(msg);
            let terminal = false;
            for (const tc of msg.tool_calls) {
              const fnName = tc.function.name;
              let args = {};
              try { args = JSON.parse(tc.function.arguments || "{}"); } catch (e) {}
              let result;
              try { result = await this._dispatchTool(fnName, args, game); } catch (e) { result = { error: t("工具异常：{e}", { e: e.message }) }; }
              this.messages.push({
                role: "tool",
                tool_call_id: tc.id,
                content: JSON.stringify(result)
              });
              if ((fnName === "play_cards" || fnName === "pass_turn") && result && result.success) {
                terminal = true;
              }
            }
            notifyAIPanel(this.position);
            if (terminal) return;
            continue;
          }

          // 无 tool calls：检查任务状态
          const content = extractContentText(msg.content);
          const status = parseTaskStatus(content);
          this.messages.push(msg);

          // 拒绝 prep 任务类型（当前是出牌阶段，不是组牌阶段）
          if (status && status.task === "prep") {
            this.messages.push({
              role: "user",
              content: t("当前是出牌阶段，不是组牌阶段。请使用 {\"task\":\"play\",\"complete\":true} 格式。调用 play_cards 或 pass_turn 工具来完成回合。")
            });
            notifyAIPanel(this.position);
            continue;
          }

          // If complete, try old-format JSON action as fallback
          if (status && status.complete && content && content.trim()) {
            try {
              const parsed = parseModelJson(content);
              if (parsed.action === "pass") { game.pass(this.position); return; }
              if (parsed.action === "play" && Array.isArray(parsed.indices)) {
                const hand = game.sortCards(this.cards);
                const selected = parsed.indices.map(i => hand[i]).filter(c => c);
                if (selected.length > 0) { const ok = game.play(this.position, selected); if (ok) return; }
              }
            } catch (e) {}
            // complete but no valid action → must use tools
            this.messages.push({
              role: "user",
              content: t("任务标记为完成，但没有有效的出牌动作。请调用 play_cards 或 pass_turn 工具来完成回合。")
            });
            notifyAIPanel(this.position);
            continue;
          }

          // Not complete or no status: prompt to continue
          const hint = status
            ? t("收到，任务状态为未完成。请继续思考并调用工具（view_hand/pile_cards/play_cards/pass_turn），完成后将 complete 设为 true。")
            : t("未找到任务状态 JSON。请继续思考，在回复末尾添加状态：{\"task\":\"play\",\"complete\":true} 配合工具调用完成出牌，或 {\"task\":\"play\",\"complete\":false} 表示还需思考。");
          this.messages.push({ role: "user", content: hint });
          notifyAIPanel(this.position);
        } catch (e) {
          // Tool call ID 相关错误：自修复后重试
          if (this._isToolIdError(e.message)) {
            const removed = this._fixupToolCalls();
            if (removed > 0) {
              addLog(t("[LLM AI] {name} 出牌时检测到 tool call ID 不匹配，已清理 {n} 条孤立的 tool 消息", { name: this.name, n: removed }));
              this.messages.push({
                role: "user",
                content: t("检测到上下文 tool call 不匹配，已自动清理 {n} 条孤立的 tool 消息。请继续出牌决策。调用 play_cards 或 pass_turn 工具来完成回合。", { n: removed })
              });
              notifyAIPanel(this.position);
              continue;
            }
          }
          addLog(t("[LLM AI] {name} 出错：{e}", { name: this.name, e: e.message }));
          if (game.lastPlay && game.lastPlay.playerIdx !== this.position) {
            game.pass(this.position);
          }
          return;
        }
      }

      // 超过最大轮次，强制出牌或过牌
      addLog(t("[LLM AI] {name} 超过思考轮次上限，强制出牌/过牌", { name: this.name }));
      if (game.lastPlay && game.lastPlay.playerIdx !== this.position) {
        game.pass(this.position);
      } else {
        // 领出者不能 pass，强制出最小的单张
        const sorted = game.sortCards(this.cards);
        if (sorted.length > 0) {
          game.play(this.position, [sorted[0]]);
        }
      }
      } finally {
        this.thinking = false;
        updateSeatInfo();
        tryProcessChatQueue();
      }
    }

    // ---------- Tool 分发 ----------
    async _dispatchTool(fnName, args, game) {
      switch (fnName) {
        case "view_hand":     return this._handleViewHand(game);
        case "pile_cards":    return this._handlePileCards(game, args.indices || [], args.groups || null);
        case "unpile_cards":  return this._handleUnpileCards(game, args.piles);
        case "play_cards":    return this._handlePlayCards(game, args.indices || []);
        case "pass_turn":     return this._handlePassTurn(game);
        case "view_history":       return this._handleViewHistory(game);
        case "read_experience":    return this._handleReadExperience();
        case "record_experience":  return this._handleRecordExperience(args.content || "");
        default:
          // 如果是 GUANDAN_TOOLS 中定义的工具但未被 switch 处理 → BUG
          const knownTools = GUANDAN_TOOLS.map(t => t.function.name);
          if (knownTools.includes(fnName)) {
            this._alertBug(t("工具 {name} 已在 GUANDAN_TOOLS 中定义但 _dispatchTool 未处理", { name: fnName }));
          }
          return { error: t("未知工具: {name}", { name: fnName }) };
      }
    }

    // ---------- view_hand ----------
    _handleViewHand(game) {
      if (this.cards.length > 0 && game.finishedOrder.indexOf(this.position) >= 0) {
        this._alertBug(t("手牌有{n}张但已在完成列表中（位置{p}）", { n: this.cards.length, p: game.finishedOrder.indexOf(this.position) }));
      }
      const sorted = game.sortCards(this.cards);
      if (sorted.length !== this.cards.length) {
        this._alertBug(t("sortCards 返回数量({a})与手牌数量({b})不一致", { a: sorted.length, b: this.cards.length }));
      }
      const handLines = sorted.map((c, i) => {
        let label = `${i}: ${c.suit||""}${c.rank}`;
        if (game.isWildCard(c)) label += " " + t("(逢人配)");
        else if (game.isLevelCard(c)) label += " " + t("(级牌)");
        return label;
      });

      let pilesDesc = t("无");
      if (this.piles.length > 0) {
        pilesDesc = this.piles.map((p, pi) => {
          const pileCards = p.cardIds.map(id => this.cards.find(c => c.id === id)).filter(c => c);
          const sortedPile = game.sortCards(pileCards);
          const cardDesc = sortedPile.map(c => `${c.suit||""}${c.rank}`).join(" ");
          const analysis = game.analyzeCards(pileCards);
          const typeDesc = analysis ? TYPE_NAMES[analysis.type] || analysis.type : t("未知");
          const idxs = p.cardIds.map(id => sorted.findIndex(c => c.id === id)).join(", ");
          return t("牌摞{pi}: 索引 [{indices}] → {cards} ({type})", { pi, indices: idxs, cards: cardDesc, type: typeDesc });
        }).join("\n");
      }

      const wilds = this.cards.filter(c => game.isWildCard(c));
      const wildList = wilds.map(c => c.suit + c.rank).join(", ") || t("无");
      const levelInfo = t("级牌: {rank}，逢人配: {n}张（{list}）", { rank: game.levelRank, n: wilds.length, list: wildList });

      return {
        hand: handLines.join("\n"),
        piles: pilesDesc,
        hand_size: this.cards.length,
        level_rank: game.levelRank,
        wild_count: wilds.length,
        info: levelInfo,
        _reminder: t("注意：每次 pile/unpile/play 之后，手牌排序会变化，索引会失效。下次操作前请重新调用 view_hand。")
      };
    }

    // ---------- pile_cards ----------
    _handlePileCards(game, indices, groups) {
      // Determine the groups to process
      let groupList;
      if (groups && groups.length > 0) {
        // 容错：如果 groups 元素不是数组（如 LLM 传了 groups: [0,1,2]），当作单组处理
        if (!Array.isArray(groups[0])) {
          groupList = [groups];
        } else {
          groupList = groups;
        }
      } else if (indices && indices.length > 0) {
        groupList = [indices]; // single-group mode
      } else {
        return { error: t("请提供 indices（单组）或 groups（多组）参数。推荐使用 groups 一次完成全部组牌，如 groups: [[0,1],[3,4,5],[7,8,9,10,11]]") };
      }

      const sorted = game.sortCards(this.cards);
      const results = [];
      const allCardIds = [];

      // 前置验证：检查各组索引是否有重叠、单张、范围
      const seenIndices = new Map(); // index → group number
      for (let g = 0; g < groupList.length; g++) {
        const raw = groupList[g];
        const idxList = Array.isArray(raw) ? raw : [raw];
        if (!idxList || idxList.length === 0) continue;
        // 单张牌不能组牌——不要传单张索引到 groups 里，散牌直接留在手牌中即可
        if (idxList.length === 1) {
          return { error: t("第{g}组只有1张牌（索引 {idx}）。单张牌不需要理牌，请从 groups 中移除所有单张。散牌留在手牌中即可，只有多张组成的牌型才需要放进 groups。", { g: g + 1, idx: idxList[0] }) };
        }
        for (const idx of idxList) {
          if (seenIndices.has(idx)) {
            return {
              error: t("索引 {idx} 同时出现在第{a}组和第{b}组中。groups 各组索引必须互不重叠——每张牌只能归入一组。请重新规划，确保各组的索引完全不重复。", { idx, a: seenIndices.get(idx) + 1, b: g + 1 }),
              overlap: true,
              conflictingIndex: idx,
              group1: seenIndices.get(idx),
              group2: g
            };
          }
          // 验证索引范围
          if (idx < 0 || idx >= sorted.length) {
            return { error: t("索引 {idx} 超出范围（当前手牌共 {n} 张，有效索引 0~{m}）", { idx, n: sorted.length, m: sorted.length - 1 }), invalidIndex: true };
          }
          seenIndices.set(idx, g);
        }
      }

      for (let g = 0; g < groupList.length; g++) {
        const raw = groupList[g];
        // 容错：单个元素若不是数组则包裹
        const idxList = Array.isArray(raw) ? raw : [raw];
        if (!idxList || idxList.length === 0) {
          results.push({ group: g, error: t("第{n}组索引为空", { n: g + 1 }) });
          continue;
        }
        const cards = idxList.map(i => sorted[i]).filter(c => c);
        if (cards.length !== idxList.length) {
          const mapped = idxList.map(i => sorted[i] ? `${i}:${sorted[i].suit||""}${sorted[i].rank}` : `${i}:${t("无效")}`);
          results.push({ group: g, error: t("第{n}组部分索引无效：[{list}]", { n: g + 1, list: mapped.join(", ") }) });
          continue;
        }
        const analysis = game.analyzeCards(cards);
        if (!analysis) {
          if (cards.length >= 2) {
            const allSameRank = cards.every(c => c.rank === cards[0].rank);
            if (allSameRank) {
              this._alertBug(t("{n}张同点数牌({rank})analyzeCards返回null", { n: cards.length, rank: cards[0].rank }));
            }
          }
          const cardDesc = cards.map(c => `${c.suit||""}${c.rank}`).join(" ");
          results.push({ group: g, error: t("第{n}组 [{cards}] 无法组成合法牌型", { n: g + 1, cards: cardDesc }) });
          continue;
        }
        if (analysis.type === "single") {
          results.push({ group: g, error: t("第{n}组是单张，无需组牌", { n: g + 1 }) });
          continue;
        }
        const cardIds = cards.map(c => c.id);
        this.pileCards(cardIds);
        const created = this.piles.find(p => p.cardIds.length === cardIds.length && p.cardIds.every(id => cardIds.includes(id)));
        if (!created) {
          this._alertBug(t("pileCards 调用后未找到新建的牌摞（cardIds: {ids}）", { ids: JSON.stringify(cardIds) }));
        }
        const typeName = TYPE_NAMES[analysis.type] || analysis.type;
        results.push({ group: g, success: true, message: t("第{n}组：{type}（{m}张）", { n: g + 1, type: typeName, m: cards.length }), type: typeName, power: analysis.power });
        allCardIds.push(...cardIds);
      }

      // 清理幽灵牌摞：牌被抽走后，剩余牌可能不再构成合法牌型
      this.piles = this.piles.filter(p => {
        const cards = p.cardIds.map(id => this.cards.find(c => c.id === id)).filter(c => c);
        if (cards.length < 2) return false;
        return game.analyzeCards(cards) !== null;
      });

      const successCount = results.filter(r => r.success).length;
      const failCount = results.filter(r => r.error).length;
      const summary = groupList.length > 1
        ? (failCount > 0
            ? t("共{n}组：{a}组成功，{b}组失败", { n: groupList.length, a: successCount, b: failCount })
            : t("共{n}组：{a}组成功", { n: groupList.length, a: successCount }))
        : (results[0] && results[0].success ? results[0].message : "");
      if (successCount > 0) renderPlayerCards(this.position);
      const ret = { success: failCount === 0, summary, details: results };
      this._logDecision("pile_cards", { groups: groupList }, ret);
      return ret;
    }

    // ---------- unpile_cards ----------
    _handleUnpileCards(game, piles) {
      // 容错：单个数字转为数组
      if (typeof piles === "number") piles = [piles];
      if (!piles || !Array.isArray(piles) || piles.length === 0) {
        return { error: t("请提供要拆散的牌摞编号（piles 参数，如 [0] 或 [0,2]）。牌摞编号来自 view_hand 中显示的「牌摞N」。"), invalidPiles: true };
      }

      // 前置验证：所有编号是否有效
      for (const pi of piles) {
        if (typeof pi !== "number" || pi < 0 || pi >= this.piles.length) {
          return { error: t("牌摞编号 {pi} 无效。当前共 {n} 个牌摞（编号 0~{m}）。请先调用 view_hand 查看当前牌摞列表。", { pi, n: this.piles.length, m: this.piles.length - 1 }), invalidPiles: true };
        }
      }

      // 检查是否有重复编号
      const unique = new Set(piles);
      if (unique.size !== piles.length) {
        return { error: t("piles 中有重复的牌摞编号，请去重后重新提交。") };
      }

      // 从大到小排序，先拆后面的摞避免编号偏移
      const sortedPiles = [...piles].sort((a, b) => b - a);

      const results = [];
      for (const pi of sortedPiles) {
        const pile = this.piles[pi];
        const pileCards = pile.cardIds.map(id => this.cards.find(c => c.id === id)).filter(c => c);
        const cardDesc = pileCards.map(c => `${c.suit||""}${c.rank}`).join(" ");
        this.unpileCards(pile.cardIds);
        results.push({ success: true, message: t("牌摞{pi} [{cards}]（{n}张）已拆散", { pi, cards: cardDesc, n: pileCards.length }) });
      }

      renderPlayerCards(this.position);

      const ret = {
        success: true,
        summary: t("共拆散 {n} 个牌摞", { n: piles.length }),
        details: results
      };
      this._logDecision("unpile_cards", { piles }, ret);
      return ret;
    }

    // ---------- play_cards ----------
    _handlePlayCards(game, indices) {
      // 容错：LLM 可能传单个数字而非数组
      if (typeof indices === "number") indices = [indices];
      if (!Array.isArray(indices) || indices.length === 0) return { error: t("请提供要出牌的索引数组") };
      const sorted = game.sortCards(this.cards);
      const cards = indices.map(i => sorted[i]).filter(c => c);
      if (cards.length !== indices.length) {
        const mapped = indices.map(i => sorted[i] ? `${i}:${sorted[i].suit||""}${sorted[i].rank}` : `${i}:${t("无效")}`);
        return { error: t("部分索引无效。手牌共{n}张(索引0-{m})。你提供的索引对应的牌: [{list}]。请先调用 view_hand 重新确认。", { n: this.cards.length, m: this.cards.length - 1, list: mapped.join(", ") }) };
      }

      const analysis = game.analyzeCards(cards);
      if (!analysis) {
        const cardDesc = cards.map(c => `${c.suit||""}${c.rank}`).join(" ");
        return { error: t("所选牌 [{cards}] 无法组成合法牌型。可能原因: 1) 索引过时(手牌排序在理牌/出牌后可能变化) 2) 牌型不合法。请先调用 view_hand 重新确认索引。", { cards: cardDesc }), indices };
      }

      if (game.lastPlay && game.lastPlay.playerIdx !== this.position) {
        if (!game.canBeat(analysis, game.lastPlay.analysis)) {
          return { error: t("所选牌型（{a}）打不过场上牌（{b}），请重新选择或过牌", { a: TYPE_NAMES[analysis.type], b: TYPE_NAMES[game.lastPlay.type] }) };
        }
      }

      const ok = game.play(this.position, cards);
      if (!ok) {
        // 检查是否可能是系统 BUG：牌型合法且满足出牌规则，但 game.play 返回 false
        if (game.lastPlay && game.lastPlay.playerIdx !== this.position) {
          const canBeat = game.canBeat(analysis, game.lastPlay.analysis);
          if (canBeat) {
            this._alertBug(t("牌型可打过场上牌但 game.play 返回 false：{type}", { type: TYPE_NAMES[analysis.type] || analysis.type }));
          }
        } else if (!game.lastPlay || game.lastPlay.playerIdx === this.position) {
          this._alertBug(t("是领出者且牌型合法但 game.play 返回 false：{type}", { type: TYPE_NAMES[analysis.type] || analysis.type }));
        }
        return { error: t("出牌失败，请重试") };
      }
      // 验证出牌后手牌是否减少
      const remainingIds = new Set(this.cards.map(c => c.id));
      const stillPresent = cards.filter(c => remainingIds.has(c.id));
      if (stillPresent.length > 0) {
        this._alertBug(t("出牌成功后仍有{n}张牌留在手牌中", { n: stillPresent.length }));
      }
      return { success: true, message: t("已出{n}张牌：{type}", { n: cards.length, type: TYPE_NAMES[analysis.type] || analysis.type }) };
    }

    // ---------- pass_turn ----------
    _handlePassTurn(game) {
      if (!game.lastPlay) return { error: t("你是领出者，不能过牌。请出牌。") };
      if (game.lastPlay.playerIdx === this.position) return { error: t("当前你是领出者，不能过牌。") };
      const ok = game.pass(this.position);
      if (!ok) {
        this._alertBug(t("game.pass 返回 false，但 lastPlay 存在且非本人（lastPlay.playerIdx={a}, this.position={b}）", { a: game.lastPlay.playerIdx, b: this.position }));
        return { error: t("过牌失败") };
      }
      return { success: true, message: t("已过牌") };
    }

    // ---------- view_history ----------
    _handleViewHistory(game) {
      if (game.roundHistory.length === 0) {
        return { rounds: [], summary: t("本局尚无出牌记录") };
      }

      // 按轮分组（newRoundAfter 标记一轮结束）
      const roundGroups = [];
      let currentRound = [];
      for (const entry of game.roundHistory) {
        currentRound.push(entry);
        if (entry.newRoundAfter) {
          roundGroups.push(currentRound);
          currentRound = [];
        }
      }
      if (currentRound.length > 0) {
        roundGroups.push(currentRound);
      }

      const rounds = roundGroups.map((entries, ri) => {
        const roundDesc = entries.map(e => {
          if (e.cards === null) {
            return t("{who} 过牌", { who: e.playerName });
          }
          const sorted = game.sortCards(e.cards);
          const analysis = game.analyzeCards(sorted);
          const typeName = analysis ? TYPE_NAMES[analysis.type] || analysis.type : "?";
          const cardsDesc = sorted.map(c => `${c.suit||""}${c.rank}`).join(" ");
          const power = analysis ? " (power:" + analysis.power + ")" : "";
          return t("{who} 出 {type}：{cards}{power}", { who: e.playerName, type: typeName, cards: cardsDesc, power });
        });
        return { round: ri + 1, plays: roundDesc };
      });

      const totalRounds = rounds.length;
      const totalPlays = game.roundHistory.length;
      return {
        total_rounds: totalRounds,
        total_plays: totalPlays,
        rounds,
        _reminder: t("power 越小牌越小。注意哪些大牌和炸弹已出，据此判断对手剩余实力。")
      };
    }

    // ---------- read_experience ----------
    // 经验记忆按「模型」存储而非座位：同一模型换座位经验跟随，不同模型同座位互不串扰
    _expMemoryKey() {
      return "guandan_exp_" + this.providerId + "_" + (this.modelName || "unknown");
    }

    _handleReadExperience() {
      const key = this._expMemoryKey();
      try {
        const content = localStorage.getItem(key) || "";
        if (!content.trim()) {
          return { content: "", summary: t("尚无过往经验记录。") };
        }
        return { content, summary: t("过往经验已加载（共 {n} 字符）。", { n: content.length }) };
      } catch (e) {
        return { error: t("读取经验失败：{e}", { e: e.message }) };
      }
    }

    // ---------- record_experience ----------
    _handleRecordExperience(content) {
      if (!content || typeof content !== "string" || content.trim().length === 0) {
        return { error: t("请提供要记录的经验内容（content 参数不能为空）。") };
      }
      const key = this._expMemoryKey();
      try {
        localStorage.setItem(key, content.trim());
        return { success: true, message: t("经验已保存（全量覆盖，共 {n} 字符）。", { n: content.trim().length }) };
      } catch (e) {
        return { error: t("记录经验失败：{e}", { e: e.message }) };
      }
    }

    // ---------- 复盘 ----------
    // ---------- 复盘（同模型去重） ----------
    // finishGame 对每个 (服务商, 模型) 组合只触发一次复盘，mates = 该模型的所有 AI 座位。
    // 复盘原则：全局视角在打牌过程中并不存在，所以每个座位只用它自己的单视角复盘
    // （自己的手牌 + 自己的决策记录，即该座位自己的 messages），再把各视角的结论
    // 整合成一份经验一次性写回共享记忆 key，避免多座位并发覆盖同一记忆。
    async reviewGame(game, mates) {
      const waitIdle = async (p) => {
        while (p._chatPromise || (p.preparing && p._prepPromise)) {
          if (p._chatPromise) await p._chatPromise;
          if (p.preparing && p._prepPromise) await p._prepPromise;
        }
      };
      await waitIdle(this);

      // 各座位各自单视角的复盘结论
      const fragments = [];
      const labels = [];
      for (const mate of mates) {
        await waitIdle(mate);
        try {
          const text = await this._runReviewPass(mate, game);
          if (text && !this._isNothing(text)) {
            fragments.push(text.trim());
            labels.push(mate.name);
          }
        } catch (e) {
          addLog(t("{name} 复盘出错：{e}", { name: mate.name, e: e.message }));
        }
      }

      if (fragments.length === 0) {
        addLog(t("{name} 复盘完成：{n} 个座位均无可记录的经验", { name: this.name, n: mates.length }));
        return;
      }

      // 统一整合：旧经验 + 全部视角结论 → 一次全量写入共享记忆
      try {
        const oldExp = localStorage.getItem(this._expMemoryKey()) || "";
        const merged = await this._mergeExperience(fragments, labels, oldExp);
        const res = this._handleRecordExperience(merged);
        if (res.success) {
          addLog(t("{name} 复盘完成，经验已记录（整合 {n} 个座位视角）", { name: this.name, n: fragments.length }));
        }
      } catch (e) {
        addLog(t("{name} 复盘整合失败：{e}", { name: this.name, e: e.message }));
      }
    }

    // 单个座位的视角复盘：上下文只用该座位自己的 messages（本人手牌 + 本人决策记录），
    // 不接触其他座位的手牌与决策。工具限定 view_history（桌上公开出牌）与
    // read_experience（共享记忆），不提供 record_experience —— 各视角结论最后统一整合保存。
    // 返回该视角提炼出的经验文本；无内容可记录时返回 null。
    async _runReviewPass(mate, game) {
      mate.thinking = true;
      updateSeatInfo();
      try {
        mate.messages.push({
          role: "user",
          content: [
            t("【复盘】本局已结束。请从你所在座位的视角回顾本局表现，从策略层面反思经验教训——你只能基于亲眼所见（桌上出牌）和亲身决策，不应假设其他玩家的手牌。"),
            t("你可以调用 view_history 回顾本局出牌过程，调用 read_experience 查看之前的经验记录。"),
            "",
            t("【复盘要求 — 不要记具体的某手牌，要抽象出原则】"),
            t("不要记录「第X轮我出了XXX，队友出了XXX」这类具体细节。要从整局博弈中提炼出可迁移的打牌原则和博弈规律。"),
            t("请重点思考以下问题："),
            t("1. 组牌思路：是否因为组牌策略不对，导致某手牌迟迟打不出去？比如把本该拆开跟牌的牌硬组成了大牌型，或者把本该保留的炸弹拆散了？应该以什么为优先——是优先组顺子/连对以便跟牌，还是优先保留炸弹/大牌型以便压牌？"),
            t("2. 出牌节奏：自己和队友是否出现「牌出不去」的情况——手里有能打的牌但因为组牌方式导致没有合适的牌型去跟？队友是否因为你的出牌选择（比如过早打出大牌、没有及时喂牌）而陷入被动？"),
            t("3. 博弈判断：在关键轮次中，选择「压牌抢出牌权」还是「放牌让队友接」的判断准则是什么？考虑当前局势（是否头游在望、对手剩余牌数）时，决策有什么可以改进的地方？"),
            t("4. 逢人配使用：逢人配（红心级牌）有没有被浪费在低价值的牌型上？应该优先用来凑炸弹还是凑同花顺？在什么情况下应该保留逢人配而不是急于用掉？"),
            "",
            t("【保存】经验会在同模型所有座位复盘后统一整合保存，本视角不需要调用 record_experience。"),
            t("请用一段话总结你从这个座位提炼出的经验教训。如果觉得没什么可记录的，直接回复「无」即可。")
          ].join("\n")
        });
        notifyAIPanel(mate.position);

        let turns = 0;
        while (turns < 5) {
          turns++;
          try {
            const response = await callLLMWithMessages(
              mate._buildAPIMessages(game), REVIEW_TOOLS, mate.providerId, mate.modelName
            );
            const msg = response.message;

            if (msg.tool_calls && msg.tool_calls.length > 0) {
              mate.messages.push(msg);
              for (const tc of msg.tool_calls) {
                const fnName = tc.function.name;
                let args = {};
                try { args = JSON.parse(tc.function.arguments || "{}"); } catch (e) {}
                let result;
                try { result = await mate._dispatchTool(fnName, args, game); } catch (e) { result = { error: t("工具异常：{e}", { e: e.message }) }; }
                mate.messages.push({ role: "tool", tool_call_id: tc.id, content: JSON.stringify(result) });
              }
              notifyAIPanel(mate.position);
              continue;
            }

            mate.messages.push(msg);
            notifyAIPanel(mate.position);
            return typeof msg.content === "string" && msg.content.trim() ? msg.content.trim() : null;
          } catch (e) {
            // Tool call ID 相关错误：自修复后重试
            if (mate._isToolIdError(e.message)) {
              const removed = mate._fixupToolCalls();
              if (removed > 0) {
                addLog(t("{name} 复盘时检测到 tool call ID 不匹配，已清理 {n} 条孤立的 tool 消息", { name: mate.name, n: removed }));
                mate.messages.push({
                  role: "user",
                  content: t("检测到上下文 tool call 不匹配，已自动清理 {n} 条孤立的 tool 消息。请继续复盘思考。", { n: removed })
                });
                notifyAIPanel(mate.position);
                continue;
              }
            }
            throw e;
          }
        }
        return null; // 5 轮仍未给出结论
      } finally {
        mate.thinking = false;
        updateSeatInfo();
      }
    }

    // 整合各视角结论与旧经验：只输入各座位的文字结论，不输入任何游戏状态，输出统一经验文本
    async _mergeExperience(fragments, labels, oldExp) {
      const parts = [
        t("以下是同模型 {n} 个座位各自视角的复盘结论（互相独立，仅基于各自亲眼所见与亲身决策）：", { n: fragments.length })
      ];
      fragments.forEach((f, i) => {
        parts.push("【" + labels[i] + "】\n" + f);
      });
      if (oldExp && oldExp.trim()) {
        parts.push(t("以及之前保存的经验记录（整合时请完整保留其中仍然有效的部分）："));
        parts.push(oldExp.trim());
      }
      parts.push(t("请将以上内容整合为一份经验记录：去重、合并同类原则、保留所有仍然有效的要点，输出一段结构清晰的文字。不要记录具体某手牌的细节，只保留可迁移的策略原则。"));
      const messages = [
        { role: "system", content: t("你是掼蛋复盘专家，负责把多个座位各自视角的复盘结论整合成一份统一的经验记录。") },
        { role: "user", content: parts.join("\n\n") }
      ];
      const response = await callLLMWithMessages(messages, undefined, this.providerId, this.modelName);
      const text = (response.message && response.message.content) || "";
      const trimmed = text.trim();
      if (!trimmed) throw new Error(t("整合结果为空"));
      return trimmed;
    }

    // 「无」类回答判断：空内容或仅表示本视角无可记录经验
    _isNothing(text) {
      const s = (text || "").trim().replace(/[。.！!？?，,；;、\s「」【】]/g, "");
      if (!s) return true;
      if (s === "无") return true;
      if (/^(none|nothing|nothing worth)/i.test(s)) return true;
      return false;
    }

    // ---------- 局面描述 ----------
    _buildSituation(game) {
      const shouldLead = !game.lastPlay || game.lastPlay.playerIdx === this.position;
      let desc = "";

      // --- 各玩家状态 ---
      desc += t("【玩家状态】") + "\n";
      for (let i = 0; i < 4; i++) {
        const p = game.players[i];
        const finished = game.finishedOrder.indexOf(i) >= 0;
        const placeNames = ["", t("头游"), t("二游"), t("三游"), t("末游")];
        const place = game.finishedOrder.indexOf(i);
        const status = finished ? t("（已{place}）", { place: placeNames[place + 1] || t("完成") }) : "";
        const teammate = (this.position + 2) % 4 === i ? " " + t("[队友]") : "";
        const isMe = i === this.position ? " " + t("← 你") : "";
        const cardsDesc2 = finished ? t("0 张") : t("{n} 张", { n: p.cards.length });
        desc += `  ${p.name}：${cardsDesc2}${status}${teammate}${isMe}\n`;
      }

      // --- 本轮出牌记录（之前的轮次已在对话历史中） ---
      desc += "\n" + t("【本轮出牌记录】") + "\n";
      if (game.roundHistory.length === 0) {
        desc += t("  （本局尚未有人出牌）") + "\n";
      } else {
        let roundStart = 0;
        for (let i = game.roundHistory.length - 2; i >= 0; i--) {
          if (game.roundHistory[i].newRoundAfter) {
            roundStart = i + 1;
            break;
          }
        }
        const currentRound = game.roundHistory.slice(roundStart);
        for (const entry of currentRound) {
          const who = entry.playerName;
          if (entry.cards === null) {
            desc += "  " + t("{who} 过牌", { who }) + "\n";
          } else {
            const cardsDesc = entry.cards.map(c => `${c.suit||""}${c.rank}`).join(" ");
            const analysis = game.analyzeCards(entry.cards);
            const typeName = analysis ? (TYPE_NAMES[analysis.type] || analysis.type) : "?";
            desc += "  " + t("{who} 出了 {type}：{cards}", { who, type: typeName, cards: cardsDesc }) + "\n";
          }
        }
      }

      // --- 当前局面 ---
      desc += "\n" + t("【当前局面】") + "\n";
      if (shouldLead) {
        desc += t("你是领出者，可以出任意合法牌型。") + "\n";
      } else {
        const lp = game.lastPlay;
        const who = game.players[lp.playerIdx].name;
        const cardsDesc = lp.cards.map(c => `${c.suit||""}${c.rank}`).join(" ");
        desc += t("上家 {who} 出了 {type}：{cards}。", { who, type: TYPE_NAMES[lp.type] || lp.type, cards: cardsDesc }) + "\n";
        desc += t("你必须出同类型更大的牌，或用炸弹/同花顺/天王炸压制，或过牌。") + "\n";
      }
      desc += t("当前打 {rank}。红心{rank} 是逢人配。", { rank: game.levelRank }) + "\n";
      desc += t("你的手牌共 {n} 张。", { n: this.cards.length }) + "\n";
      desc += t("请先调用 view_hand 工具查看手牌和索引，然后决定如何出牌。") + "\n";
      desc += t("你可以多次调用 pile_cards 和 unpile_cards 来探索不同组合。") + "\n";
      desc += t('回复末尾必须包含任务状态 JSON：{"task":"play","complete":true}（已完成出牌决策）或 {"task":"play","complete":false}（还需思考）。');
      return desc;
    }
  }

  // ==================== GuandanGame 单局牌桌 ====================
  class GuandanGame {
    constructor(levelRank) {
      this.levelRank = levelRank;       // 当前打几
      this.levelTeamA = levelRank;      // A组打到几
      this.levelTeamB = levelRank;      // B组打到几
      this.players = [];
      this.currentPlayer = 0;
      this.lastPlay = null;
      this.passCount = 0;
      this.round = 0;
      this.started = false;
      this.finished = false;
      this.finishedOrder = [];
      this.roundHistory = [];
    }

    // ---------- Rank value ----------
    getRankValue(rank) {
      if (rank === "大王") return 17;
      if (rank === "小王") return 16;
      if (rank === this.levelRank) return 15;
      return RANK_ORDER[rank] || 0;
    }

    getBaseRankValue(rank) {
      if (rank === "大王") return 17;
      if (rank === "小王") return 16;
      return RANK_ORDER[rank] || 0;
    }

    getSuitValue(suit) {
      return { "♠":3, "♥":2, "♣":1, "♦":0 }[suit] || -1;
    }

    isLevelCard(card) {
      return card.rank === this.levelRank && card.suit !== null;
    }

    isWildCard(card) {
      return card.rank === this.levelRank && card.suit === "♥";
    }

    isRedSuit(card) {
      return card.suit === "♥" || card.suit === "♦";
    }

    sortCards(cards) {
      const self = this;
      return [...cards].sort((a, b) => {
        const rv = self.getRankValue(b.rank) - self.getRankValue(a.rank);
        if (rv !== 0) return rv;
        return self.getSuitValue(a.suit) - self.getSuitValue(b.suit);
      });
    }

    // ---------- Deck ----------
    createDeck() {
      const deck = [];
      for (let d = 0; d < 2; d++) {
        for (const suit of SUITS) {
          for (const rank of RANKS) {
            deck.push({ suit, rank, id: `${suit}${rank}_${d}` });
          }
        }
        deck.push({ suit: null, rank: "小王", id: `joker_small_${d}` });
        deck.push({ suit: null, rank: "大王", id: `joker_big_${d}` });
      }
      return deck;
    }

    shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ---------- Game init ----------
    startNewGame() {
      const deck = this.shuffle(this.createDeck());
      const seatNames = [t("南"), t("东"), t("北"), t("西")];
      const seatTeams = ["A", "B", "A", "B"];

      this.players = [];
      for (let i = 0; i < 4; i++) {
        const seatCfg = seatConfig[i] || { type: "human" };
        const isHuman = seatCfg.type === "human";
        const name = seatNames[i] + (isHuman ? t("（你）") : "");
        if (isHuman) {
          this.players[i] = new Player(name, seatTeams[i], i, true);
        } else {
          // 每个 AI 座位独立选择服务商/模型，各自创建 LLMAIPlayer
          const aiCfg = getSeatAiConfig(i);
          if (aiCfg) {
            const factory = new LLMAIPlayerFactory(aiCfg.providerId, aiCfg.modelName, GUANDAN_SYSTEM_PROMPT);
            this.players[i] = factory.createPlayer(name, seatTeams[i], i);
          } else {
            addLog(t("座位 {name} 配置为 AI 但没有可用大模型，该座位按真人处理", { name: seatNames[i] }));
            this.players[i] = new Player(name, seatTeams[i], i, true);
          }
        }
        this.players[i].cards = deck.slice(i * 27, (i + 1) * 27);
      }

      this.currentPlayer = 0;
      this.lastPlay = null;
      this.passCount = 0;
      this.round = 0;
      this.started = true;
      this.finished = false;
      this.finishedOrder = [];
      this.startedAt = Date.now(); // 开局时间（用于统计最长一局）
      this.roundHistory = [];

      const humanIdx = this.players.findIndex(p => p.isHuman);
      const levelDesc = t("当前打 {rank}，级牌 {rank} 大于 A 小于小王。", { rank: this.levelRank });
      if (humanIdx >= 0) {
        const wildCount = this.players[humanIdx].cards.filter(c => this.isWildCard(c)).length;
        addLog(t("新一局开始！{level}{name} 有 {n} 张逢人配（红心{rank}）。", { level: levelDesc, name: this.players[humanIdx].name, n: wildCount, rank: this.levelRank }));
      } else {
        addLog(t("新一局开始！{level}全部 AI 自动对战。", { level: levelDesc }));
      }

      return this;
    }

    // ---------- Pattern detection ----------
    analyzeCards(cards) {
      const n = cards.length;
      if (n === 0) return null;
      const wilds = cards.filter(c => this.isWildCard(c));
      const regulars = cards.filter(c => !this.isWildCard(c));
      const wildCount = wilds.length;
      if (wildCount === 0) return this.analyzeSimple(cards);
      return this.analyzeWithWilds(regulars, wilds);
    }

    analyzeSimple(cards) {
      const n = cards.length;
      if (n === 0) return null;

      const rankCounts = {};
      cards.forEach(c => {
        const r = c.rank;
        rankCounts[r] = (rankCounts[r] || 0) + 1;
      });
      const counts = Object.values(rankCounts).sort((a,b) => b - a);
      const uniqueRanks = Object.keys(rankCounts).length;

      // 天王炸
      if (n === 4) {
        const bigJokers = cards.filter(c => c.rank === "大王").length;
        const smallJokers = cards.filter(c => c.rank === "小王").length;
        if (bigJokers === 2 && smallJokers === 2) {
          return { type: "king_bomb", power: 99 };
        }
      }

      // Single
      if (n === 1) return { type: "single", power: this.getRankValue(cards[0].rank) };

      // Pair
      if (n === 2 && counts[0] === 2) return { type: "pair", power: this.getRankValue(cards[0].rank) };

      // Triple
      if (n === 3 && counts[0] === 3) return { type: "triple", power: this.getRankValue(cards[0].rank) };

      // Bomb: 4+ same rank
      if (counts[0] >= 4 && uniqueRanks === 1) {
        return { type: "bomb", power: this.getRankValue(cards[0].rank), length: counts[0] };
      }

      // Triple + 2：只比三张的大小，对子不影响
      if (n === 5 && counts[0] === 3 && counts[1] === 2) {
        const tripleRank = Object.keys(rankCounts).find(r => rankCounts[r] === 3);
        return { type: "triple_plus_2", power: this.getRankValue(tripleRank) };
      }

      // 钢板: exactly 2 consecutive triples
      if (n === 6 && counts.every(c => c === 3)) {
        const ranks = Object.keys(rankCounts);
        const baseVals = ranks.map(r => this.getBaseRankValue(r)).sort((a,b) => a-b);
        if (baseVals.length === 2 && this.isConsecutive(baseVals) && baseVals[1] <= 14) {
          const highestRank = ranks.reduce((a, b) => this.getBaseRankValue(a) > this.getBaseRankValue(b) ? a : b);
          return { type: "consecutive_triples", power: this.getRankValue(highestRank), length: 2 };
        }
      }

      // Consecutive pairs: exactly 3 pairs, including AA2233
      if (n === 6 && counts.every(c => c === 2)) {
        const ranks = Object.keys(rankCounts);
        const baseVals = ranks.map(r => this.getBaseRankValue(r)).sort((a,b) => a-b);
        if (baseVals.length === 3) {
          if (this.isConsecutive(baseVals) && baseVals[2] <= 14) {
            const highestRank = ranks.reduce((a, b) => this.getBaseRankValue(a) > this.getBaseRankValue(b) ? a : b);
            return { type: "consecutive_pairs", power: this.getRankValue(highestRank), length: 3 };
          }
          if (baseVals[0] === 2 && baseVals[2] === 14 && baseVals[1] === 3) {
            return { type: "consecutive_pairs", power: this.getRankValue("3"), length: 3 };
          }
        }
      }

      // Straight: exactly 5, including A2345
      if (n === 5 && counts.every(c => c === 1)) {
        const ranks = Object.keys(rankCounts);
        const baseVals = ranks.map(r => this.getBaseRankValue(r)).sort((a,b) => a-b);
        if (this.isConsecutive(baseVals) && baseVals[4] <= 14) {
          const highestRank = ranks.reduce((a, b) => this.getBaseRankValue(a) > this.getBaseRankValue(b) ? a : b);
          return { type: "straight", power: this.getRankValue(highestRank), length: 5 };
        }
        if (baseVals[0] === 2 && baseVals[4] === 14 && this.isConsecutive(baseVals.slice(0, 4))) {
          return { type: "straight", power: this.getRankValue("5"), length: 5 };
        }
      }

      // Straight flush: exactly 5, including A2345
      if (n === 5) {
        const suit = cards[0].suit;
        if (suit && cards.every(c => c.suit === suit)) {
          const baseVals = cards.map(c => this.getBaseRankValue(c.rank)).sort((a,b) => a-b);
          if (this.isConsecutive(baseVals) && baseVals[4] <= 14) {
            const highestRank = cards.reduce((a, b) => this.getBaseRankValue(a.rank) > this.getBaseRankValue(b.rank) ? a : b).rank;
            return { type: "straight_flush", power: this.getRankValue(highestRank), length: 5 };
          }
          if (baseVals[0] === 2 && baseVals[4] === 14 && this.isConsecutive(baseVals.slice(0, 4))) {
            return { type: "straight_flush", power: this.getRankValue("5"), length: 5 };
          }
        }
      }

      return null;
    }

    isConsecutive(sortedValues) {
      for (let i = 1; i < sortedValues.length; i++) {
        if (sortedValues[i] - sortedValues[i-1] !== 1) return false;
      }
      return true;
    }

    analyzeWithWilds(regulars, wilds) {
      const wildCount = wilds.length;
      const total = regulars.length + wildCount;

      if (regulars.length === 0) {
        if (wildCount === 1) return { type: "single", power: 15 };
        if (wildCount === 2) return { type: "pair", power: 15 };
        return null;
      }

      const rankCounts = {};
      regulars.forEach(c => {
        rankCounts[c.rank] = (rankCounts[c.rank] || 0) + 1;
      });

      let bestResult = null;

      // Check if wilds can complete a bomb
      const maxCount = Math.max(...Object.values(rankCounts));
      if (maxCount + wildCount >= 4) {
        let bestRank = null;
        let bestCnt = 0;
        for (const [r, cnt] of Object.entries(rankCounts)) {
          const rv = this.getRankValue(r);
          if (cnt > bestCnt || (cnt === bestCnt && rv > (bestRank ? this.getRankValue(bestRank) : 0))) {
            bestCnt = cnt;
            bestRank = r;
          }
        }
        const totalBomb = bestCnt + wildCount;
        if (totalBomb >= 4) {
          const result = { type: "bomb", power: this.getRankValue(bestRank), length: totalBomb, wildUsed: wildCount };
          if (totalBomb >= 5 && (!bestResult || result.power > bestResult.power)) {
            bestResult = result;
          } else if (totalBomb === 4 && !bestResult) {
            bestResult = result;
          }
        }
      }

      // Straight with wilds
      if (regulars.length >= 4 && wildCount >= 1) {
        const ranks = [...new Set(regulars.map(c => this.getBaseRankValue(c.rank)))].sort((a,b) => a-b);
        for (let start = 0; start < ranks.length; start++) {
          for (let len = 5; len <= 5; len++) {
            const needed = [];
            let val = ranks[start];
            for (let i = 0; i < len; i++) {
              if (!ranks.includes(val + i)) needed.push(val + i);
            }
            if (needed.length <= wildCount && val + len - 1 <= 14) {
              const highestBaseVal = val + len - 1;
              const highestRank = Object.keys(RANK_ORDER).find(r => RANK_ORDER[r] === highestBaseVal) || String(highestBaseVal);
              const power = this.getRankValue(highestRank);
              if (!bestResult || highestBaseVal > (bestResult._baseHighest || 0)) {
                bestResult = { type: "straight", power, length: len, wildUsed: needed.length, _baseHighest: highestBaseVal };
              }
            }
          }
        }
        // A2345 straight with wilds
        const regVals = [...new Set(regulars.map(c => this.getBaseRankValue(c.rank)))];
        const a2345Set = [2, 3, 4, 5, 14];
        const covered = a2345Set.filter(v => regVals.includes(v));
        const extras = regVals.filter(v => !a2345Set.includes(v));
        if (extras.length === 0 && covered.length + wildCount >= 5) {
          const wildsNeeded = 5 - covered.length;
          const a2345power = this.getRankValue("5");
          const baseHighest = 5;
          const lessWilds = wildsNeeded < (bestResult ? bestResult.wildUsed || 0 : 0);
          if (!bestResult || baseHighest > ((bestResult && bestResult._baseHighest) || 0) || (baseHighest === ((bestResult && bestResult._baseHighest) || 0) && lessWilds)) {
            bestResult = { type: "straight", power: a2345power, length: 5, wildUsed: wildsNeeded, _baseHighest: baseHighest };
          }
        }
      }

      // Consecutive pairs with wilds
      if (regulars.length >= 4 && wildCount >= 1) {
        // Collect all ranks that appear in hand (including singles)
        const handRanks = Object.keys(rankCounts).map(r => this.getBaseRankValue(r));
        // Try every possible starting value from 2 to 12 (max start for 3 pairs ending at A=14)
        for (let startVal = 2; startVal <= 12; startVal++) {
          const endVal = startVal + 2; // 3 consecutive pairs: start, start+1, start+2
          if (endVal > 14) continue;
          // Check if any card in this range exists in hand
          const hasAny = handRanks.some(v => v >= startVal && v <= endVal);
          if (!hasAny) continue;
          let wildsNeeded = 0;
          for (let v = startVal; v <= endVal; v++) {
            const rank = Object.keys(RANK_ORDER).find(r => RANK_ORDER[r] === v);
            const cnt = rank ? (rankCounts[rank] || 0) : 0;
            wildsNeeded += Math.max(0, 2 - cnt); // Need (2 - cnt) wilds to complete a pair
          }
          if (wildsNeeded > 0 && wildsNeeded <= wildCount) {
            const highestRank = Object.keys(RANK_ORDER).find(r => RANK_ORDER[r] === endVal);
            if (highestRank) {
              const power = this.getRankValue(highestRank);
              if (!bestResult || endVal > (bestResult._baseHighest || 0) || (endVal === (bestResult._baseHighest || 0) && wildsNeeded < (bestResult.wildUsed || 999))) {
                bestResult = { type: "consecutive_pairs", power, length: 3, wildUsed: wildsNeeded, _baseHighest: endVal };
              }
            }
          }
        }
        // AA2233 special: handles 2-3-14 sequence
        const aa2233Ranks = { "2": 2, "3": 3, "A": 14 };
        let aaWildsNeeded = 0;
        for (const [r, v] of Object.entries(aa2233Ranks)) {
          const cnt = rankCounts[r] || 0;
          aaWildsNeeded += Math.max(0, 2 - cnt);
        }
        if (aaWildsNeeded > 0 && aaWildsNeeded <= wildCount) {
          const baseHighest = 3;
          if (!bestResult || baseHighest > (bestResult._baseHighest || 0) || (baseHighest === (bestResult._baseHighest || 0) && aaWildsNeeded < (bestResult.wildUsed || 999))) {
            bestResult = { type: "consecutive_pairs", power: this.getRankValue("3"), length: 3, wildUsed: aaWildsNeeded, _baseHighest: baseHighest };
          }
        }
      }

      // 钢板 with wilds
      if (!bestResult && regulars.length >= 3 && wildCount >= 1) {
        const rankEntries = Object.entries(rankCounts).map(([r, cnt]) => ({
          rank: r, cnt, baseVal: this.getBaseRankValue(r)
        }));
        for (const entry of rankEntries) {
          const val1 = entry.baseVal;
          if (val1 >= 14) continue;
          const nextEntry = rankEntries.find(e => e.baseVal === val1 + 1);
          const cnt2 = nextEntry ? nextEntry.cnt : 0;
          const w1 = Math.max(0, 3 - entry.cnt);
          const w2 = Math.max(0, 3 - cnt2);
          const wildsNeeded = w1 + w2;
          if (wildsNeeded > 0 && wildsNeeded <= wildCount) {
            const highestRank = nextEntry ? nextEntry.rank : Object.keys(RANK_ORDER).find(r => RANK_ORDER[r] === val1 + 1);
            if (highestRank) {
              const power = this.getRankValue(highestRank);
              const baseHighest = val1 + 1;
              if (!bestResult || baseHighest > (bestResult._baseHighest || 0)) {
                bestResult = { type: "consecutive_triples", power, length: 2, wildUsed: wildsNeeded, _baseHighest: baseHighest };
              }
            }
          }
        }
      }

      // Straight flush with wilds
      if (!bestResult && regulars.length >= 4 && wildCount >= 1) {
        const suits = [...new Set(regulars.map(c => c.suit))];
        if (suits.length === 1 && suits[0]) {
          const ranks = [...new Set(regulars.map(c => this.getBaseRankValue(c.rank)))].sort((a,b) => a-b);
          for (let start = 0; start < ranks.length; start++) {
            const needed = [];
            const val = ranks[start];
            for (let i = 0; i < 5; i++) {
              if (!ranks.includes(val + i)) needed.push(val + i);
            }
            if (needed.length <= wildCount && val + 4 <= 14) {
              const highestBaseVal = val + 4;
              const highestRank = Object.keys(RANK_ORDER).find(r => RANK_ORDER[r] === highestBaseVal) || String(highestBaseVal);
              const power = this.getRankValue(highestRank);
              if (!bestResult || highestBaseVal > (bestResult._baseHighest || 0)) {
                bestResult = { type: "straight_flush", power, length: 5, wildUsed: needed.length, _baseHighest: highestBaseVal };
              }
            }
          }
          // A2345 straight flush with wilds
          const a2345SFSet = [2, 3, 4, 5, 14];
          const sfCovered = a2345SFSet.filter(v => ranks.includes(v));
          const sfExtras = ranks.filter(v => !a2345SFSet.includes(v));
          if (sfExtras.length === 0 && sfCovered.length + wildCount >= 5) {
            const wildsNeeded = 5 - sfCovered.length;
            const sfPower = this.getRankValue("5");
            const baseHighest = 5;
            const lessWilds = wildsNeeded < (bestResult ? bestResult.wildUsed || 0 : 0);
            if (!bestResult || baseHighest > ((bestResult && bestResult._baseHighest) || 0) || (baseHighest === ((bestResult && bestResult._baseHighest) || 0) && lessWilds)) {
              bestResult = { type: "straight_flush", power: sfPower, length: 5, wildUsed: wildsNeeded, _baseHighest: baseHighest };
            }
          }
        }
      }

      // Fallback: simple patterns
      if (!bestResult) {
        const regularRanks = regulars.map(c => c.rank);
        const uniqueRegRanks = [...new Set(regularRanks)];
        const totalCount = regulars.length + wildCount;
        // 三带二 with wilds: triple + pair from 5 cards
        if (totalCount === 5 && wildCount >= 1) {
          for (const rank of uniqueRegRanks) {
            const cnt = regularRanks.filter(r => r === rank).length;
            const wildsForTriple = Math.max(0, 3 - cnt);
            if (wildsForTriple > wildCount) continue;
            const wildsLeft = wildCount - wildsForTriple;
            const regularsLeft = regulars.length - cnt;
            // Remaining cards + wilds must form a pair (2 cards)
            if (regularsLeft + wildsLeft >= 2) {
              bestResult = { type: "triple_plus_2", power: this.getRankValue(rank), wildUsed: wildsForTriple + Math.max(0, 2 - regularsLeft) };
              break;
            }
          }
        }
        // Pair with 1 wild
        if (!bestResult) {
          for (const rank of uniqueRegRanks) {
            const cnt = regularRanks.filter(r => r === rank).length;
            const power = this.getRankValue(rank);
            if (totalCount === 2 && cnt === 1 && wildCount === 1) {
              bestResult = { type: "pair", power, wildUsed: 1 };
              break;
            }
            if (totalCount === 3 && cnt >= 1 && cnt + wildCount >= 3) {
              bestResult = { type: "triple", power, wildUsed: 3 - cnt };
              break;
            }
          }
        }
        if (!bestResult && regulars.length === 0) {
          if (wildCount === 2) bestResult = { type: "pair", power: 15, wildUsed: 2 };
          else if (wildCount === 1) bestResult = { type: "single", power: 15, wildUsed: 1 };
        }
        if (!bestResult) return null;
      }

      return bestResult;
    }

    // ---------- Comparison ----------
    canBeat(newAnalysis, lastAnalysis) {
      if (!lastAnalysis) return true;

      if (newAnalysis.type === "king_bomb") return true;
      if (lastAnalysis.type === "king_bomb") return false;

      const bombTypes = ["bomb", "straight_flush"];
      const newIsBomb = bombTypes.includes(newAnalysis.type);
      const lastIsBomb = bombTypes.includes(lastAnalysis.type);

      if (newIsBomb && !lastIsBomb) return true;
      if (!newIsBomb && lastIsBomb) return false;

      if (newIsBomb && lastIsBomb) {
        const newLen = newAnalysis.length || 4;
        const lastLen = lastAnalysis.length || 4;
        if (newLen !== lastLen) return newLen > lastLen;
        if (newAnalysis.type === "straight_flush" && lastAnalysis.type !== "straight_flush") return true;
        if (newAnalysis.type !== "straight_flush" && lastAnalysis.type === "straight_flush") return false;
        return newAnalysis.power > lastAnalysis.power;
      }

      if (newAnalysis.type !== lastAnalysis.type) return false;
      if (newAnalysis.length && newAnalysis.length !== lastAnalysis.length) return false;
      return newAnalysis.power > lastAnalysis.power;
    }

    // ---------- Turn management ----------
    nextPlayer() {
      let next = (this.currentPlayer + 1) % 4;
      let tries = 0;
      while (this.players[next].cards.length === 0 && tries < 4) {
        next = (next + 1) % 4;
        tries++;
      }
      this.currentPlayer = next;
    }

    // ---------- Game actions ----------
    play(playerIdx, cards) {
      const analysis = this.analyzeCards(cards);
      if (!analysis) return false;

      if (this.lastPlay && this.lastPlay.playerIdx !== playerIdx) {
        if (!this.canBeat(analysis, this.lastPlay.analysis)) return false;
      }

      if (!this.lastPlay || this.lastPlay.playerIdx === playerIdx) {
        if (this.roundHistory.length > 0) {
          this.roundHistory[this.roundHistory.length - 1].newRoundAfter = true;
        }
      }

      const player = this.players[playerIdx];
      this.roundHistory.push({ playerIdx, cards: [...cards], playerName: player.name });
      player.removeCards(cards.map(c => c.id));
      // 清理幽灵牌摞：出牌后某些牌摞可能不再构成合法牌型（如 999QQ 三带二打出 QQ 后剩余 999）
      player.piles = player.piles.filter(p => {
        const pileCards = p.cardIds.map(id => player.cards.find(c => c.id === id)).filter(c => c);
        if (pileCards.length < 2) return false;
        return this.analyzeCards(pileCards) !== null;
      });

      this.lastPlay = { playerIdx, cards, analysis, type: analysis.type };
      this.passCount = 0;
      this.round++;

      const wildNote = analysis.wildUsed ? t("（使用逢人配 {n} 张）", { n: analysis.wildUsed }) : "";
      addLog(t("{name} 出了 {type}（{n}张）{note}", { name: player.name, type: TYPE_NAMES[analysis.type] || analysis.type, n: cards.length, note: wildNote }));

      // Check win
      if (player.cards.length === 0) {
        this.finishedOrder.push(playerIdx);
        const place = this.finishedOrder.length;
        const placeNames = ["", t("头游"), t("二游"), t("三游"), t("末游")];
        addLog(t("{name} 成为{place}！", { name: player.name, place: placeNames[place] }));

        if (place === 1) {
          const remaining = this.players.filter(p => p.cards.length > 0);
          if (remaining.length <= 1) {
            this.endGame();
            return true;
          }
          this.nextPlayer();
          renderAll();
          setTimeout(async () => {
            updateCurrentPlayerIndicator();
            await this.aiPlay();
          }, 600);
          return true;
        } else if (place === 2) {
          const headPlayer = this.players[this.finishedOrder[0]];
          if (player.team === headPlayer.team) {
            addLog(t("{team}双上！", { team: player.team === "A" ? t("A组") : t("B组") }));
            this.endGame();
            return true;
          }
        } else if (place >= 3) {
          this.endGame();
          return true;
        }
      }

      this.nextPlayer();
      renderAll();
      setTimeout(async () => {
        updateCurrentPlayerIndicator();
        await this.aiPlay();
      }, 600);
      return true;
    }

    pass(playerIdx) {
      if (!this.lastPlay) return false;
      if (this.lastPlay.playerIdx === playerIdx) return false;
      this.passCount++;
      addLog(t("{name} 过牌", { name: this.players[playerIdx].name }));
      this.roundHistory.push({ playerIdx, cards: null, playerName: this.players[playerIdx].name });
      this.nextPlayer();
      renderAll();

      if (this.passCount >= 3) {
        if (this.roundHistory.length > 0) {
          this.roundHistory[this.roundHistory.length - 1].newRoundAfter = true;
        }
        let winner = this.lastPlay.playerIdx;
        if (this.players[winner].cards.length === 0) {
          const teammate = (winner + 2) % 4;
          if (this.players[teammate].cards.length > 0) {
            winner = teammate;
            addLog(t("{name} 接风！", { name: this.players[teammate].name }));
          } else {
            this.endGame();
            return true;
          }
        }
        addLog(t("{name} 获得新一轮出牌权", { name: this.players[winner].name }));
        this.lastPlay = null;
        this.passCount = 0;
        this.currentPlayer = winner;
        renderAll();
        setTimeout(async () => {
          updateCurrentPlayerIndicator();
          await this.aiPlay();
        }, 600);
        return true;
      }

      setTimeout(async () => {
        updateCurrentPlayerIndicator();
        await this.aiPlay();
      }, 600);
      return true;
    }

    endGame() {
      if (this.finished) return; // 幂等：防止重复结算/重复弹层
      this.finished = true;

      for (let i = 0; i < 4; i++) {
        if (!this.finishedOrder.includes(i)) this.finishedOrder.push(i);
      }

      const placeNames = [t("头游"), t("二游"), t("三游"), t("末游")];
      const teamAPlaces = [];
      const teamBPlaces = [];

      this.finishedOrder.forEach((playerIdx, order) => {
        const player = this.players[playerIdx];
        const place = order + 1;
        if (player.team === "A") teamAPlaces.push(place);
        else teamBPlaces.push(place);
      });

      const headPlayer = this.players[this.finishedOrder[0]];
      const winTeam = headPlayer.team;
      const winTeamLabel = winTeam === "A" ? t("A组") : t("B组");

      let upgradeLevels = 1;
      if (winTeam === "A") {
        if (teamAPlaces.includes(1) && teamAPlaces.includes(2)) upgradeLevels = 3;
        else if (teamAPlaces.includes(1) && teamAPlaces.includes(3)) upgradeLevels = 2;
      } else {
        if (teamBPlaces.includes(1) && teamBPlaces.includes(2)) upgradeLevels = 3;
        else if (teamBPlaces.includes(1) && teamBPlaces.includes(3)) upgradeLevels = 2;
      }

      const currentLevelIdx = LEVEL_RANKS.indexOf(this.levelRank);
      const newLevelIdx = Math.min(LEVEL_RANKS.length - 1, currentLevelIdx + upgradeLevels);
      this.levelRank = LEVEL_RANKS[newLevelIdx];

      const resultMsg = this.finishedOrder.map((pIdx, i) =>
        t("{place}: {name}（{team}组）", { place: placeNames[i], name: this.players[pIdx].name, team: this.players[pIdx].team })
      ).join(t("，"));

      addLog(t("========== 本局结束 =========="));
      addLog(t("结果：{msg}", { msg: resultMsg }));
      addLog(t("{team}获胜！连升 {n} 级，当前打 {rank}", { team: winTeamLabel, n: upgradeLevels, rank: this.levelRank }));

      // 记录对局战绩（localStorage，首页「本机战绩」展示用）
      const statsKey = "guandan_challenge_stats";
      const stats = lsGetJSON(statsKey, { games: 0, teamA: 0, teamB: 0 });
      stats.games = (stats.games || 0) + 1;
      const winSeats = winTeam === "A" ? [0, 2] : [1, 3]; // A 组=南+北，B 组=东+西
      if (winTeam === "A") stats.teamA = (stats.teamA || 0) + 1;
      else stats.teamB = (stats.teamB || 0) + 1;
      // 座位胜场：赢家座位各 +1（首页「胜率最高座位」用）
      stats.seatWins = stats.seatWins || {};
      winSeats.forEach(i => { stats.seatWins[i] = (stats.seatWins[i] || 0) + 1; });
      // 模型胜场：获胜局中出现的模型各 +1，同一局同一模型只计一次（首页「最会赢的模型」用）
      stats.modelWins = stats.modelWins || {};
      const winModels = new Set();
      winSeats.forEach(i => {
        const p = this.players[i];
        if (p instanceof LLMAIPlayer) winModels.add(p.providerId + " · " + p.modelName);
      });
      winModels.forEach(m => { stats.modelWins[m] = (stats.modelWins[m] || 0) + 1; });
      // 最长一局
      const gameSec = Math.round((Date.now() - (this.startedAt || Date.now())) / 1000);
      if (gameSec > (stats.longestGameSec || 0)) {
        stats.longestGameSec = gameSec;
        stats.longestGameAt = new Date().toISOString();
      }
      lsSetJSON(statsKey, stats);

      const statusColor = winTeam === "A" ? "#0f8a5f" : "#c06d2b";
      $("#gameStatus").text(t("游戏结束 - {team}胜（升{n}级 → 打{rank}）", { team: winTeamLabel, n: upgradeLevels, rank: this.levelRank })).css("color", statusColor);
      // Hide all seat action buttons
      $(".seat-actions").hide();
      renderLevelBadge();
      renderAll();

      // 结局仪式弹层（稍等一拍，让最后一手牌先呈现）
      setTimeout(() => {
        showVictoryModal(this, winTeam, upgradeLevels);
      }, 400);

      // 触发 AI 玩家复盘：同一 (服务商, 模型) 只复盘一次，但覆盖该模型所有座位（各自单视角）
      setTimeout(() => {
        const groups = new Map();
        for (const p of this.players) {
          if (!(p instanceof LLMAIPlayer)) continue;
          const key = p.providerId + "|" + (p.modelName || "unknown");
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(p);
        }
        for (const mates of groups.values()) {
          const lead = mates[0];
          lead.reviewGame(this, mates).catch(e => addLog(t("{name} 复盘失败：{e}", { name: lead.name, e: e.message })));
        }
      }, 2000);
    }

    // ---------- AI ----------
    async aiPlay() {
      if (this.finished) return;
      const idx = this.currentPlayer;
      const player = this.players[idx];
      if (!player || player.cards.length === 0) return;
      await player.decidePlay(this);
      // 出牌后异步重新理牌（不阻塞下一家）
      if (player instanceof LLMAIPlayer && player.cards.length > 0) {
        player.prepareHand(this, "post_play").catch(() => {});
      }
    }
  }

  // ==================== 结局仪式弹层 ====================
  function spawnConfetti() {
    const colors = ["#e2b052", "#0f8a5f", "#34d399", "#c06d2b", "#fbbf24", "#f87171", "#60a5fa", "#a78bfa"];
    const overlay = document.getElementById("victoryOverlay");
    for (let i = 0; i < 40; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = (Math.random() * 100) + "vw";
      piece.style.width = (6 + Math.random() * 6) + "px";
      piece.style.height = (8 + Math.random() * 8) + "px";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      if (Math.random() > 0.5) piece.style.borderRadius = "50%";
      piece.style.animationDuration = (2.4 + Math.random() * 1.8) + "s";
      piece.style.animationDelay = (Math.random() * 0.9) + "s";
      overlay.appendChild(piece);
      (function(el) { setTimeout(function() { el.remove(); }, 5200); })(piece);
